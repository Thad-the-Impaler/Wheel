<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wheel of Everything</title>
<!-- The favicon is an inline SVG rather than a sibling .ico, because this
     file has to stay self-contained: it is opened over file:// from iCloud. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2231.6%22 fill=%22%230a0b11%22/><path d=%22M32 32L32.0 1.5A30.5 30.5 0 0 1 58.41 16.75Z%22 fill=%22%23ffd166%22/><path d=%22M32 32L58.41 16.75A30.5 30.5 0 0 1 58.41 47.25Z%22 fill=%22%238b7cff%22/><path d=%22M32 32L58.41 47.25A30.5 30.5 0 0 1 32.0 62.5Z%22 fill=%22%23ff9a3c%22/><path d=%22M32 32L32.0 62.5A30.5 30.5 0 0 1 5.59 47.25Z%22 fill=%22%234cc9f0%22/><path d=%22M32 32L5.59 47.25A30.5 30.5 0 0 1 5.59 16.75Z%22 fill=%22%23ff6ea9%22/><path d=%22M32 32L5.59 16.75A30.5 30.5 0 0 1 32.0 1.5Z%22 fill=%22%234fd6a0%22/><circle cx=%2232%22 cy=%2232%22 r=%227.0%22 fill=%22%2312141f%22/></svg>">
<meta name="theme-color" content="#0a0b11">
<meta name="description" content="Build a wheel out of anything, add to it forever, and spin to pick one at random.">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#0a0b11;
  --bg-2:#0f111a;
  --panel:#141724;
  --panel-2:#1a1e2e;
  --panel-3:#232840;
  --line:#2a3050;
  --line-soft:#212639;
  --text:#e9ecf6;
  --text-2:#a6aec8;
  --text-3:#6d7796;
  --brand:#8b7cff;
  --brand-2:#a894ff;
  --brand-dim:rgba(139,124,255,.15);
  --hot:#ff6ea9;
  --warm:#ffb454;
  --danger:#ff6b6b;
  --ok:#4fd6a0;
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --shadow:0 20px 55px -22px rgba(0,0,0,.9);
  --shadow-sm:0 6px 18px -8px rgba(0,0,0,.75);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --display:"Poppins","Avenir Next","Futura",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --panel-w:344px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-size:15px;
  line-height:1.5;
  overscroll-behavior:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1000px 620px at 8% -12%, rgba(139,124,255,.13), transparent 62%),
    radial-gradient(880px 600px at 96% 110%, rgba(255,110,169,.09), transparent 60%),
    radial-gradient(700px 500px at 60% 50%, rgba(255,180,84,.045), transparent 70%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
textarea{resize:none}
/* Fallback size for any inline icon not given explicit dimensions, so a bare
   svg() call can never balloon to the SVG default 300x150. */
svg{width:1em;height:1em;flex:0 0 auto}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3250;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3b4368;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(139,124,255,.32)}
.hidden{display:none!important}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:9px;
  padding:0 14px;border-bottom:1px solid var(--line-soft);
  background:rgba(15,17,26,.82);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);z-index:12;
}
.tb-brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px;cursor:pointer;padding:6px 8px;border-radius:9px;transition:background .15s}
.tb-brand:hover{background:var(--panel-2)}
.tb-brand .mark{width:23px;height:23px;color:var(--brand);flex:0 0 23px}
.tb-brand span{font-size:14px}
.tb-spacer{flex:1}
.tb-title{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.tb-title .n{color:var(--text-3);font-weight:400;font-size:12.5px;margin-left:8px}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);
  font-size:13px;font-weight:500;transition:.16s var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--panel-3);color:var(--text);border-color:#3a4268}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px;flex:0 0 15px}
.btn.primary{background:var(--brand);color:#0d0a1c;border-color:var(--brand);font-weight:600}
.btn.primary:hover{background:var(--brand-2);color:#0d0a1c}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.28)}
.btn.danger:hover{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.5);color:#ff9494}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.sm svg{width:13.5px;height:13.5px;flex:0 0 13.5px}
.btn.icon{padding:8px;border-radius:9px}
.btn.icon svg{width:16px;height:16px;flex:0 0 16px}
.btn.icon.sm{padding:5px}
.btn.on{background:var(--brand-dim);color:var(--brand-2);border-color:rgba(139,124,255,.4)}
.btn[disabled]{opacity:.38;pointer-events:none}

.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);padding:7px 10px;border-radius:9px;transition:background .15s}
.sync:hover{background:var(--panel-2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.sync.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(79,214,160,.15)}
.sync.off .dot{background:var(--text-3)}
.sync.err .dot{background:var(--danger)}
.sync.sav .dot{background:var(--warm);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.28}}

.view{flex:1;min-height:0;position:relative;overflow:hidden}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:36px 26px 90px}
.fade{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   HOME / GALLERY
   ============================================================ */
.hero{text-align:center;padding:22px 0 34px}
.hero .crest{width:78px;height:78px;color:var(--brand);margin-bottom:18px;filter:drop-shadow(0 10px 26px rgba(139,124,255,.35));animation:crestspin 26s linear infinite}
@keyframes crestspin{to{transform:rotate(360deg)}}
.hero h1{font-family:var(--display);font-size:clamp(32px,5.4vw,50px);font-weight:600;letter-spacing:-.6px;line-height:1.08}
.hero h1 em{font-style:normal;background:linear-gradient(96deg,var(--brand-2),var(--hot) 55%,var(--warm));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{color:var(--text-3);margin-top:13px;font-size:14.5px;max-width:520px;margin-left:auto;margin-right:auto}
.hero .foot{margin-top:24px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center}

.ghead{display:flex;align-items:flex-end;gap:14px;margin:8px 0 18px;flex-wrap:wrap}
.ghead h2{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.2px}
.ghead .sp{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.wcard{
  background:linear-gradient(165deg,var(--panel) 0%,var(--bg-2) 100%);
  border:1px solid var(--line);border-radius:var(--radius-lg);
  overflow:hidden;text-align:left;transition:.22s var(--ease);position:relative;display:flex;flex-direction:column;
}
.wcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(340px 170px at 50% 0%,rgba(139,124,255,.12),transparent 72%);opacity:0;transition:opacity .22s}
.wcard:hover{transform:translateY(-3px);border-color:#3c4470;box-shadow:var(--shadow)}
.wcard:hover::after{opacity:1}
.wcard .prev{height:158px;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.045),transparent 62%);flex:0 0 158px;position:relative}
.wcard .prev canvas{width:134px;height:134px;display:block;transition:transform .5s var(--ease)}
.wcard:hover .prev canvas{transform:rotate(24deg)}
.wcard .body{padding:15px 17px 17px;border-top:1px solid var(--line-soft)}
.wcard h4{font-size:15.5px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard p{font-size:12.5px;color:var(--text-3);line-height:1.48;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.wcard .meta{margin-top:11px;display:flex;gap:12px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap;align-items:center}
.wcard .meta span{display:inline-flex;align-items:center;gap:5px}
.wcard .meta svg{width:13px;height:13px;flex:0 0 13px}
.wcard .meta b{color:var(--text-2);font-weight:600}
.wcard .rowact{position:absolute;top:10px;right:10px;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.wcard:hover .rowact,.wcard:focus-within .rowact{opacity:1}
.wcard .rowact .btn{background:rgba(10,11,17,.85);backdrop-filter:blur(6px)}
.newcard{
  border:1.5px dashed var(--line);border-radius:var(--radius-lg);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  color:var(--text-3);min-height:250px;transition:.2s var(--ease);
}
.newcard:hover{border-color:var(--brand);color:var(--brand-2);background:var(--brand-dim);transform:translateY(-3px)}
.newcard svg{width:26px;height:26px}
.newcard span{font-size:13.5px;font-weight:500}

.empty{text-align:center;padding:56px 20px;color:var(--text-3)}
.empty svg{width:42px;height:42px;margin-bottom:14px;opacity:.4}
.empty h3{font-size:16px;color:var(--text-2);font-weight:500;margin-bottom:6px}
.empty p{font-size:13.5px;max-width:400px;margin:0 auto 18px;line-height:1.6}

/* ============================================================
   WHEEL VIEW
   ============================================================ */
.wv{height:100%;display:flex;min-height:0}
.stage{
  flex:1;min-width:0;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:22px 22px 26px;gap:16px;overflow:hidden;
}
.stage-top{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:8px;align-items:center;z-index:3;pointer-events:none}
.stage-top > *{pointer-events:auto}
.stage-top .sp{flex:1}

.wheelbox{position:relative;flex:0 1 auto;display:grid;place-items:center;touch-action:manipulation}
.wheelbox canvas{display:block;border-radius:50%;cursor:pointer;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.05), 0 0 90px -30px rgba(139,124,255,.35)}
.wheelbox.spinning canvas{cursor:default}

.pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:42px;height:52px;
  z-index:4;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));
  transform-origin:50% 12%;transition:transform .09s var(--ease);
}
.pointer svg{width:42px;height:52px}
.pointer.tick{transform:translateX(-50%) rotate(-13deg)}

.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:23%;height:23%;min-width:74px;min-height:74px;border-radius:50%;
  background:linear-gradient(160deg,#262c47,#141826);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 26px -8px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.14);
  display:grid;place-items:center;gap:1px;color:var(--text);
  font-family:var(--display);font-weight:700;letter-spacing:.6px;font-size:clamp(11px,1.5vw,14px);
  transition:.18s var(--ease);z-index:3;cursor:pointer;text-transform:uppercase;
}
.hub:hover{background:linear-gradient(160deg,#2f3654,#1a1f31);transform:translate(-50%,-50%) scale(1.045)}
.hub:active{transform:translate(-50%,-50%) scale(.97)}
.hub[disabled]{opacity:.55;pointer-events:none}
.hub .sub{font-size:9px;letter-spacing:.9px;color:var(--text-3);font-weight:600}

.stage-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;z-index:3}
.spinbtn{
  padding:13px 34px;border-radius:14px;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:#120b1e;border:0;
  background:linear-gradient(96deg,var(--warm),var(--hot) 52%,var(--brand-2));
  box-shadow:0 12px 30px -12px rgba(255,110,169,.7), inset 0 1px 0 rgba(255,255,255,.4);
  transition:.18s var(--ease);
}
.spinbtn:hover{transform:translateY(-2px);box-shadow:0 18px 38px -14px rgba(255,110,169,.85), inset 0 1px 0 rgba(255,255,255,.4)}
.spinbtn:active{transform:translateY(0)}
.spinbtn[disabled]{opacity:.45;pointer-events:none;filter:saturate(.5)}

.wtip{
  position:absolute;z-index:6;pointer-events:none;padding:6px 11px;border-radius:9px;
  background:rgba(10,11,17,.94);border:1px solid var(--line);font-size:12.5px;white-space:nowrap;
  box-shadow:var(--shadow-sm);transform:translate(-50%,-140%);max-width:240px;overflow:hidden;text-overflow:ellipsis;
}
.wtip b{color:var(--text)}
.wtip .w{color:var(--text-3);margin-left:6px;font-size:11px}

.nowheel{text-align:center;color:var(--text-3);max-width:330px}
.nowheel h3{font-size:16px;color:var(--text-2);margin-bottom:7px;font-weight:500}
.nowheel p{font-size:13.5px;line-height:1.6;margin-bottom:16px}

/* ============================================================
   PANEL
   ============================================================ */
.panel{
  width:var(--panel-w);flex:0 0 var(--panel-w);border-left:1px solid var(--line-soft);
  background:rgba(15,17,26,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;flex-direction:column;min-height:0;z-index:8;
}
.panel.closed{display:none}
.ptabs{display:flex;gap:4px;padding:10px 10px 0;flex:0 0 auto}
.ptab{
  flex:1;padding:9px 6px;border-radius:9px 9px 0 0;font-size:12.5px;font-weight:600;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;border-bottom:2px solid transparent;
}
.ptab svg{width:14px;height:14px;flex:0 0 14px}
.ptab:hover{color:var(--text-2);background:var(--panel-2)}
.ptab.on{color:var(--text);border-bottom-color:var(--brand);background:var(--panel-2)}
.ptab .ct{font-size:10.5px;color:var(--text-3);background:var(--panel-3);padding:1px 6px;border-radius:999px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:14px}
.pfoot{flex:0 0 auto;padding:11px 14px;border-top:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#closepanel{display:none}
@media(min-width:901px){ .pfoot.only-close{display:none} }

.quickadd{display:flex;gap:8px;margin-bottom:12px}
.quickadd .inp{flex:1;min-width:0}
.qfilter{position:relative;margin-bottom:11px}
.qfilter svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3);pointer-events:none}
.qfilter input{width:100%;padding:8px 11px 8px 33px;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;transition:.15s}
.qfilter input:focus{border-color:var(--brand)}

.elist{display:flex;flex-direction:column;gap:5px}
.eitem{
  display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;border-radius:11px;
  border:1px solid transparent;transition:.14s;position:relative;background:var(--panel);
}
.eitem:hover{border-color:var(--line);background:var(--panel-2)}
.eitem.off{opacity:.42}
.eitem.hit{animation:hitflash 1.1s var(--ease)}
@keyframes hitflash{0%{background:var(--brand-dim);border-color:var(--brand)}100%{background:var(--panel);border-color:transparent}}
.eitem .sw{width:34px;height:34px;border-radius:9px;flex:0 0 34px;overflow:hidden;position:relative;display:grid;place-items:center;cursor:pointer}
.eitem .sw img{width:100%;height:100%;object-fit:cover;display:block}
.eitem .sw .ini{font-family:var(--display);font-weight:700;font-size:14px;color:rgba(0,0,0,.55)}
.eitem .sw .cam{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);opacity:0;transition:opacity .14s;color:#fff}
.eitem .sw .cam svg{width:14px;height:14px}
.eitem:hover .sw .cam{opacity:1}
.eitem .tx{flex:1;min-width:0}
.eitem .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .ds{font-size:11.5px;color:var(--text-3);display:flex;gap:9px;margin-top:1px}
.eitem .ds span{display:inline-flex;align-items:center;gap:3px}
.eitem .ds svg{width:11px;height:11px;flex:0 0 11px}
.eitem .acts{display:flex;gap:2px;opacity:0;transition:opacity .14s;flex:0 0 auto}
.eitem:hover .acts,.eitem:focus-within .acts{opacity:1}
.eitem .acts .btn{padding:5px;border:0;background:transparent;color:var(--text-3)}
.eitem .acts .btn:hover{background:var(--panel-3);color:var(--text)}
.eitem .acts .btn svg{width:14px;height:14px;flex:0 0 14px}

.sechead{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--text-3);margin:16px 0 9px;
}
.sechead .sp{flex:1}
.sechead:first-child{margin-top:0}

.hitem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;transition:.14s}
.hitem:hover{background:var(--panel-2)}
.hitem .sw{width:30px;height:30px;border-radius:8px;flex:0 0 30px;overflow:hidden;display:grid;place-items:center}
.hitem .sw img{width:100%;height:100%;object-fit:cover;display:block}
.hitem .sw .ini{font-family:var(--display);font-weight:700;font-size:12.5px;color:rgba(0,0,0,.55)}
.hitem .tx{flex:1;min-width:0}
.hitem .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .ago{font-size:11.5px;color:var(--text-3)}

.stat{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stat .nm{font-size:12.5px;width:96px;flex:0 0 96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.stat .bar{flex:1;height:7px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:99px;transition:width .4s var(--ease)}
.stat .n{font-size:11.5px;color:var(--text-3);width:44px;text-align:right;flex:0 0 44px;font-variant-numeric:tabular-nums}

.setrow{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1;min-width:0}
.setrow .tx b{display:block;font-size:13.5px;font-weight:500}
.setrow .tx small{display:block;font-size:11.5px;color:var(--text-3);line-height:1.45;margin-top:2px}
.sw-toggle{width:40px;height:23px;border-radius:99px;background:var(--panel-3);position:relative;flex:0 0 40px;transition:.18s var(--ease);border:1px solid var(--line)}
.sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--text-3);transition:.18s var(--ease)}
.sw-toggle.on{background:var(--brand-dim);border-color:var(--brand)}
.sw-toggle.on::after{transform:translateX(17px);background:var(--brand-2)}

.slider{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:var(--panel-3);outline:none;margin-top:4px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--brand-2);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.slider::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--brand-2);cursor:pointer}

.palgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.palcard{padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);text-align:left;transition:.15s}
.palcard:hover{border-color:#3a4268}
.palcard.on{border-color:var(--brand);background:var(--brand-dim)}
.palcard .sws{display:flex;gap:3px;margin-bottom:7px}
.palcard .sws i{flex:1;height:15px;border-radius:4px}
.palcard span{font-size:11.5px;color:var(--text-2)}

/* ============================================================
   RESULT OVERLAY
   ============================================================ */
.res{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(5,6,11,.84);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);animation:ovin .26s var(--ease);
}
.rescard{
  width:100%;max-width:452px;max-height:calc(100vh - 48px);overflow-y:auto;background:linear-gradient(170deg,var(--panel),var(--bg-2));
  border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);
  animation:resin .5s var(--ease);position:relative;
}
@keyframes resin{0%{opacity:0;transform:scale(.86) translateY(22px)}60%{transform:scale(1.02) translateY(0)}100%{opacity:1;transform:none}}
.rescard .glow{position:absolute;inset:-40% -20% auto;height:70%;pointer-events:none;opacity:.5;filter:blur(52px)}
.rescard .kicker{
  position:relative;text-align:center;padding:19px 22px 0;font-size:11px;font-weight:700;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--text-3);
}
/* The whole picture, never a crop. The frame takes the picture's own shape
   (within limits), so most images fill it edge to edge; anything too tall or
   too wide to fit those limits is letterboxed against a blurred copy of
   itself rather than bars. */
.resimg{
  position:relative;margin:15px 22px 0;border-radius:18px;overflow:hidden;
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.09);
  /* A definite height, set from the picture's own shape once it loads. It has
     to be a real length, not just an aspect-ratio: the image's max-height:100%
     can only resolve against a parent whose height is definite. */
  height:250px;max-height:min(46vh,400px);background:#0b0d15;
  transition:height .3s var(--ease);
}
.resimg .bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:blur(26px) saturate(1.4);transform:scale(1.3);opacity:.55;
}
.resimg img.main{
  /* Positioned against the frame itself, not against a grid row: the row is
     content-sized, so a percentage max-height there resolves against the
     picture's own height and constrains nothing. inset+margin:auto centres it
     while max-width/max-height shrink it to fit, keeping its proportions. */
  position:absolute;inset:0;margin:auto;
  max-width:100%;max-height:100%;width:auto;height:auto;
  display:block;border-radius:2px;
  box-shadow:0 12px 36px -16px rgba(0,0,0,.95);
  opacity:0;transition:opacity .28s var(--ease);
}
.resimg img.main.shown{opacity:1}
.resimg .ini{font-family:var(--display);font-size:96px;font-weight:800;color:rgba(255,255,255,.5);letter-spacing:-3px;text-shadow:0 3px 14px rgba(0,0,0,.35)}
.resimg .addimg{
  position:absolute;bottom:10px;right:10px;background:rgba(10,11,17,.82);backdrop-filter:blur(6px);
}
.rescard h2{
  position:relative;font-family:var(--display);font-size:clamp(24px,5.4vw,34px);font-weight:700;letter-spacing:-.6px;
  text-align:center;padding:18px 24px 0;line-height:1.15;word-break:break-word;
}
.rescard .note{position:relative;text-align:center;padding:9px 30px 0;font-size:13.5px;color:var(--text-2);line-height:1.55;white-space:pre-wrap}
.rescard .rmeta{position:relative;text-align:center;padding:12px 24px 0;font-size:12px;color:var(--text-3);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.rescard .rmeta span{display:inline-flex;align-items:center;gap:5px}
.rescard .rmeta svg{width:12px;height:12px;flex:0 0 12px}
.rescard .racts{position:relative;padding:20px 22px 22px;display:flex;gap:9px;flex-wrap:wrap}
.rescard .racts .btn{flex:1;justify-content:center}
.rescard .racts .btn.wide{flex:1 0 100%}
#confetti{position:fixed;inset:0;z-index:95;pointer-events:none}

/* ============================================================
   OVERLAYS / MODALS
   ============================================================ */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:22px;
  background:rgba(5,6,11,.78);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);animation:ovin .2s var(--ease)}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.modal{
  position:relative;width:100%;max-width:490px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);animation:modin .26s var(--ease);
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
}
@keyframes modin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal.wide{max-width:680px}
.mod-h{padding:19px 22px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;flex:0 0 auto}
.mod-h h3{font-size:17px;font-weight:600;flex:1}
.mod-h .sub{font-size:12.5px;color:var(--text-3);margin-top:3px;font-weight:400}
.mod-b{padding:20px 22px;overflow-y:auto;flex:1;min-height:0}
.mod-f{padding:14px 22px 18px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line-soft);flex:0 0 auto;flex-wrap:wrap}
.mod-f .sp{flex:1}

.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);margin-bottom:7px}
.field .hint{font-size:12px;color:var(--text-3);margin-top:7px;line-height:1.55}
.inp{
  width:100%;padding:11px 13px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);font-size:14px;outline:none;transition:.15s;
}
.inp:focus{border-color:var(--brand);background:var(--bg)}
.inp::placeholder{color:#4a5470}
textarea.inp{min-height:88px;line-height:1.6;resize:vertical}
.row2{display:flex;gap:11px}
.row2 > *{flex:1;min-width:0}

.imgbox{display:flex;flex-direction:column;gap:10px}
.img-prev{
  height:150px;border-radius:var(--radius-sm);border:1.5px dashed var(--line);
  display:grid;place-items:center;gap:7px;color:#4a5470;background:var(--bg-2);overflow:hidden;position:relative;
}
.img-prev svg{width:26px;height:26px}
.img-prev span{font-size:12.5px}
.img-prev.has{border-style:solid}
.img-prev img{width:100%;height:100%;object-fit:cover;display:block}
.img-acts{display:flex;gap:8px;flex-wrap:wrap}

.steps{font-size:13.5px;color:var(--text-2);line-height:1.62;padding-left:18px}
.steps li{margin-bottom:11px}
.steps li b{color:var(--text)}
.steps code{background:var(--bg);padding:1.5px 6px;border-radius:5px;font-size:12px;font-family:var(--mono);color:var(--brand-2)}
pre.code{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;
  font-family:var(--mono);font-size:11.5px;line-height:1.62;
  color:#9db0d4;overflow-x:auto;white-space:pre;max-height:250px;overflow-y:auto;
}
.checkrow{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text-2);cursor:pointer;padding:5px 0}
.checkrow input{width:16px;height:16px;accent-color:var(--brand);flex:0 0 16px}

/* ============================================================
   PICTURE PICKER
   ============================================================ */
/* one control row: search field with the two catalogues beside it */
.isbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.isfield{position:relative;flex:1 1 200px;min-width:0}
.isfield svg.ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3);pointer-events:none}
.isfield input{
  width:100%;padding:10px 13px 10px 38px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);font-size:14px;outline:none;transition:.15s;
}
.isfield input:focus{border-color:var(--brand);background:var(--bg)}
.pick-src{display:flex;gap:3px;background:var(--bg-2);padding:3px;border-radius:9px;border:1px solid var(--line);flex:0 0 auto}
.pick-src button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text-3);transition:.15s}
.pick-src button:hover{color:var(--text-2)}
.pick-src button.on{background:var(--panel-3);color:var(--text)}

.isgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px;
  max-height:min(46vh,420px);overflow-y:auto;padding-right:4px;align-content:start;
}
.iscard{
  position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;
  border:1px solid var(--line);transition:border-color .16s var(--ease),box-shadow .16s var(--ease);padding:0;
  /* gently shimmer until the thumbnail arrives, so the grid never looks broken */
  background:linear-gradient(100deg,var(--bg-2) 34%,var(--panel-2) 50%,var(--bg-2) 66%);
  background-size:240% 100%;animation:shimmer 1.5s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0% 50%}}
.iscard.ready{animation:none;background:var(--bg-2)}
.iscard:hover{border-color:var(--brand);box-shadow:0 0 0 3px rgba(139,124,255,.16)}
.iscard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s var(--ease)}
.iscard:hover img{transform:scale(1.06)}
/* the name and licence stay out of the way until you're looking at one */
.iscard .cap{
  position:absolute;left:0;right:0;bottom:0;padding:20px 9px 7px;text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.88));
  opacity:0;transition:opacity .16s;pointer-events:none;
}
.iscard:hover .cap{opacity:1}
.iscard .cap b{display:block;font-size:11px;font-weight:600;color:#fff;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iscard .cap i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.3px;color:rgba(255,255,255,.62);text-transform:uppercase;margin-top:1px}
.iscard.busy{pointer-events:none}
.iscard.busy::after{content:"";position:absolute;inset:0;background:rgba(10,11,17,.72)}
.iscard.busy::before{content:"";position:absolute;z-index:2;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
  border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}

.isstate{display:grid;place-items:center;gap:11px;padding:52px 20px;color:var(--text-3);text-align:center;font-size:13px;line-height:1.6}
.isstate svg{width:28px;height:28px;opacity:.4}
.isstate kbd{
  font-family:var(--font);font-size:11.5px;background:var(--panel-3);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:var(--text-2);
}

/* thin hint line under the grid */
.isfoot{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
.isfoot .sp{flex:1}
.isfoot kbd{font-family:var(--font);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--text-2)}
.isfoot button{font-size:11.5px;color:var(--brand-2);display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;transition:.14s}
.isfoot button:hover{background:var(--brand-dim)}
.isfoot button svg{width:12px;height:12px}

/* ---- rapid fill mode ---- */
.fill-prog{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin-bottom:18px}
.fill-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--hot));transition:width .35s var(--ease)}
.fill-for{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);text-align:center}
.fill-name{
  font-family:var(--display);font-size:clamp(21px,4.4vw,29px);font-weight:700;letter-spacing:-.4px;
  text-align:center;margin:5px 0 16px;line-height:1.2;word-break:break-word;
}
.fill-zone{
  border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--bg-2);
  display:grid;place-items:center;gap:11px;padding:30px 22px;text-align:center;
  color:var(--text-3);font-size:13px;line-height:1.6;transition:.16s var(--ease);
}
.fill-zone svg{width:30px;height:30px;opacity:.45}
.fill-zone kbd{
  font-family:var(--font);font-size:12px;background:var(--panel-3);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;color:var(--text);font-weight:600;
}
.fill-zone.over{border-color:var(--brand);border-style:solid;background:var(--brand-dim);color:var(--brand-2)}
.fill-zone.busy{border-color:var(--brand);color:var(--brand-2)}
.fill-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fill-acts .btn{flex:1;justify-content:center;min-width:132px}
.fill-done{display:grid;place-items:center;gap:12px;padding:38px 20px;text-align:center;color:var(--text-2);font-size:14px}
.fill-done svg{width:34px;height:34px;color:var(--ok)}
.fill-skipped{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:12px}

/* the current picture, shown in the dialog's header slot */
.ishead-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}

/* drag anywhere over the dialog */
.isover{
  position:absolute;inset:0;z-index:5;display:none;place-items:center;
  background:rgba(10,11,17,.9);backdrop-filter:blur(3px);border-radius:var(--radius-lg);
}
.isover.on{display:grid}
.isover > div{
  display:grid;place-items:center;gap:12px;padding:34px 46px;border-radius:var(--radius);
  border:2px dashed var(--brand);color:var(--brand-2);font-size:14px;font-weight:600;
}
.isover svg{width:32px;height:32px}

/* an entry row accepting a dragged picture */
.eitem.dropping{border-color:var(--brand)!important;background:var(--brand-dim)!important}
.eitem.dropping .sw{outline:2px solid var(--brand);outline-offset:1px}

.credit{font-size:11px;color:var(--text-3);text-align:center;padding:10px 24px 0;line-height:1.5}
.credit a{color:var(--text-2);text-decoration:underline;text-underline-offset:2px}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:11px 18px;border-radius:11px;background:var(--panel-3);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:13.5px;animation:tin .26s var(--ease);display:flex;align-items:center;gap:9px;max-width:88vw;
}
.toast svg{width:15px;height:15px;flex:0 0 15px}
.toast.ok{color:var(--ok)}.toast.err{color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;flex:0 0 15px}
@keyframes sp{to{transform:rotate(360deg)}}

/* presentation mode */
body.present .topbar,body.present .panel,body.present .stage-top{display:none}
body.present .stage{padding:14px}
#exitpresent{display:none;position:fixed;top:14px;right:14px;z-index:20;background:rgba(20,23,36,.8);backdrop-filter:blur(8px)}
body.present #exitpresent{display:inline-flex}

/* mobile */
.panel-toggle{display:none}
@media(max-width:900px){
  :root{--panel-w:100%}
  .wv{flex-direction:column}
  .stage{flex:1 1 auto;padding:14px 14px 18px}
  .panel{
    position:absolute;left:0;right:0;bottom:0;top:0;transform:translateY(100%);
    transition:transform .26s var(--ease);border-left:0;border-top:1px solid var(--line);
    background:rgba(10,11,17,.97);
  }
  .panel.open{transform:none}
  .panel.closed{display:flex}
  .panel-toggle{display:inline-flex}
  .wrap{padding:26px 15px 80px}
  .tb-title{max-width:40vw}
  .tb-brand span{display:none}
  .sync span:last-child{display:none}
  .sync{padding:8px}
  .resimg{max-height:38vh}
  #hidepanel{display:none}
  #closepanel{display:inline-flex}
}
</style>

<body>
<div id="app"></div>
<div id="overlays"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="filepick" accept="image/*" class="hidden">
<input type="file" id="jsonpick" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ============================================================================
   THE WHEEL OF EVERYTHING
   Single-file randomizer: build any number of wheels, add entries forever,
   spin, and get a name + picture for whatever it lands on.

   ARCHITECTURE
   - All state lives in DB (in-memory maps) and is mirrored to localStorage.
   - Optional Supabase backend gives multi-device sync + live collaboration.
     One row per node (wheel or slice) so two people editing different wheels
     never overwrite each other and realtime payloads stay small.
   - Everything must remain in this one file: the app is opened via file://
     from iCloud Drive, where sibling .css/.js files are blocked by Chrome.
   ============================================================================ */

/* ---------------------------------------------------------------- constants */
const LS = { data:"woe.data.v1", cloud:"woe.cloud.v1", queue:"woe.queue.v1", prefs:"woe.prefs.v1" };
const TAU = Math.PI*2;
const POINTER = -Math.PI/2;      // the pointer sits at 12 o'clock
const MAX_HISTORY = 120;         // per wheel, trimmed on write
/** The paste shortcut differs by platform and gets shown in a few places. */
const PASTE_KEY = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent) ? "\u2318V" : "Ctrl+V";

const LABEL_FONT = "'Poppins','Avenir Next',-apple-system,sans-serif";
const LABEL_REF  = 100;          // measure once at this size, then scale to fit

/** Width of a name at LABEL_REF px. The font is fixed, so this only ever needs
 *  working out once per distinct name rather than once per label per frame. */
const _labelW = new Map();
function labelWidth(ctx, text){
  let w = _labelW.get(text);
  if(w === undefined){
    if(_labelW.size > 4000) _labelW.clear();
    ctx.font = `600 ${LABEL_REF}px ${LABEL_FONT}`;
    w = ctx.measureText(text).width;
    _labelW.set(text, w);
  }
  return w;
}

const PALETTES = {
  carnival:{ label:"Carnival", colors:["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#38d9a9","#4dabf7","#9775fa","#f783ac"] },
  sunset:  { label:"Sunset",   colors:["#ffd166","#ffa552","#ff7f51","#f4614f","#d94f7c","#a44fa0","#ff9770","#ffbf69"] },
  aurora:  { label:"Aurora",   colors:["#4cc9f0","#4895ef","#4361ee","#7f5af0","#9d4edd","#38d9a9","#57cc99","#80ffdb"] },
  candy:   { label:"Candy",    colors:["#ffadad","#ffd6a5","#fdffb6","#caffbf","#9bf6ff","#a0c4ff","#bdb2ff","#ffc6ff"] },
  ember:   { label:"Ember",    colors:["#f9c74f","#f8961e","#f3722c","#f94144","#e5615e","#ffb703","#fb8500","#ef476f"] },
  ocean:   { label:"Ocean",    colors:["#a8dadc","#7ad0d6","#48cae4","#00b4d8","#3f88c5","#5390d9","#64dfdf","#80ced7"] },
  meadow:  { label:"Meadow",   colors:["#b7e4c7","#95d5b2","#74c69d","#a3d977","#d8f3a3","#ffe066","#c7f9cc","#8ecae6"] },
  dusk:    { label:"Dusk",     colors:["#8b7cff","#a894ff","#c77dff","#e0aaff","#7b8cde","#6f86d6","#9d8df1","#b8a4ff"] },
  vintage: { label:"Vintage",  colors:["#d9bf77","#c98c5e","#a8763e","#8c9a6b","#6b8f71","#b56576","#e0a458","#cfae70"] },
  vapor:   { label:"Vapor",    colors:["#ff71ce","#01cdfe","#05ffa1","#b967ff","#fffb96","#ff9de2","#7af5ff","#c2a5ff"] },
};
const PAL_KEYS = Object.keys(PALETTES);

const DEFAULT_OPTS = {
  palette:"carnival",
  weighted:false,     // slice size follows each entry's weight
  eliminate:false,    // the winner retires from the wheel after landing
  duration:5.5,       // seconds of spin
  labels:true,        // draw entry names on the wedges
  shuffleColors:false,
};

/* ------------------------------------------------------------------- icons */
const ICON = {
  wheel:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4" stroke="currentColor" stroke-width="1.3" opacity=".75"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/>',
  plus:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  x:'<path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',

/* Some glyphs aren't visually centred in the 24x24 box, so they look off
   inside round/square buttons. These offsets shift them back to centre. */
const NUDGE = { left:[1,0], right:[-1,0], up:[0,1], down:[0,-1], cloud:[.1,-.6], play:[.6,0], copy:[-.5,0] };
const svg = (n, cls="") => {
  const g = ICON[n]||"";
  const k = NUDGE[n];
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${
    k ? `<g transform="translate(${k[0]} ${k[1]})">${g}</g>` : g}</svg>`;
};

/* ----------------------------------------------------------------- helpers */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = p => p+"_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const now = () => new Date().toISOString();
const h = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const debounce = (fn,ms) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

/** Unbiased float in [0,1) from the CSPRNG — a wheel deserves better than
 *  Math.random's implementation-defined quality. */
function rnd(){
  const b = new Uint32Array(1);
  crypto.getRandomValues(b);
  return b[0] / 4294967296;
}
const rndBetween = (a,b)=>a+rnd()*(b-a);

/** Perceived luminance, so slice labels stay readable on any palette. */
function lum(hex){
  const c = hex.replace("#","");
  const n = c.length===3 ? c.split("").map(x=>x+x).join("") : c;
  const r = parseInt(n.slice(0,2),16)/255, g = parseInt(n.slice(2,4),16)/255, b = parseInt(n.slice(4,6),16)/255;
  const f = v => v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4);
  return .2126*f(r) + .7152*f(g) + .0722*f(b);
}
const inkOn = hex => lum(hex) > .45 ? "rgba(18,14,30,.92)" : "rgba(255,255,255,.96)";
function shade(hex, amt){
  const c = hex.replace("#",""); const n = c.length===3 ? c.split("").map(x=>x+x).join("") : c;
  const p = [0,2,4].map(i=>{
    let v = parseInt(n.slice(i,i+2),16);
    v = amt>0 ? v + (255-v)*amt : v * (1+amt);
    return clamp(Math.round(v),0,255).toString(16).padStart(2,"0");
  });
  return "#"+p.join("");
}

function fmtAgo(iso){
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(!isFinite(s)) return "";
  if(s < 45) return "just now";
  if(s < 3600) return Math.round(s/60)+"m ago";
  if(s < 86400) return Math.round(s/3600)+"h ago";
  if(s < 86400*7) return Math.round(s/86400)+"d ago";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
const plural = (n,one,many)=>`${n} ${n===1?one:(many||one+"s")}`;

function toast(msg, kind=""){
  const el = document.createElement("div");
  el.className = "toast "+kind;
  el.innerHTML = (kind==="ok"?svg("check"):kind==="err"?svg("x"):"") + `<span>${h(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s,transform .3s"; el.style.opacity="0"; el.style.transform="translateY(8px)";
    setTimeout(()=>el.remove(),320); }, 2600);
}

/* ============================================================================
   DATA LAYER
   Nodes are flat: { id, type:'wheel'|'slice', wheelId, data:{...},
                     updatedAt, deleted }
   ============================================================================ */
const DB = {
  wheels:new Map(),
  slices:new Map(),
  // Fresh per page load, NOT per browser: this only suppresses the echo of
  // writes made by *this* page instance. Sharing it across tabs would make two
  // windows on one machine ignore each other's live updates.
  clientId: uid("c"),

  all(){ return [...this.wheels.values(), ...this.slices.values()]; },
  get(id){ return this.wheels.get(id) || this.slices.get(id) || null; },

  put(node, {local=true}={}){
    if(!node || !node.id || !node.type) return;
    const n = normalize(node);
    const map = n.type==="wheel" ? this.wheels : this.slices;
    const prev = map.get(n.id);
    // last-write-wins per node, by timestamp
    if(prev && !local && prev.updatedAt > n.updatedAt) return;
    map.set(n.id, n);
    if(local){ n.updatedAt = now(); Cloud.push(n); }
    persist();
  },

  remove(id, {local=true}={}){
    const n = this.get(id); if(!n) return;
    n.deleted = true; n.updatedAt = now();
    if(n.type==="wheel"){
      for(const s of this.slices.values()) if(s.wheelId===id && !s.deleted){
        s.deleted = true; s.updatedAt = now(); if(local) Cloud.push(s);
      }
    }
    if(local) Cloud.push(n);
    persist();
  },

  wheelList(){
    return [...this.wheels.values()].filter(w=>!w.deleted)
      .sort((a,b)=>(a.data.order??0)-(b.data.order??0) || (a.data.name||"").localeCompare(b.data.name||""));
  },
  /** Every entry, listed the way a person reads a list: alphabetically. */
  slicesOf(wid){
    return [...this.slices.values()].filter(s=>!s.deleted && s.wheelId===wid).sort(byName);
  },
  /** Entries actually on the wheel right now, in their scattered wheel order.
   *  Deliberately NOT the list order — neighbouring names shouldn't end up as
   *  neighbouring wedges. */
  liveOf(wid){
    return [...this.slices.values()]
      .filter(s=>!s.deleted && s.wheelId===wid && s.data.enabled!==false)
      .sort(bySpot);
  },
};

const byName = (a,b) =>
  (a.data.name||"").localeCompare(b.data.name||"", undefined, {numeric:true, sensitivity:"base"})
  || (a.data.createdAt||"").localeCompare(b.data.createdAt||"");
// `spot` is a fixed random number per entry; sorting on it scatters the wedges
// and keeps them put between spins. Ties fall back to the id so every device
// draws the same wheel.
const bySpot = (a,b) => (a.data.spot - b.data.spot) || a.id.localeCompare(b.id);

function normalize(n){
  const d = n.data || {};
  if(n.type==="wheel"){
    return {
      id:n.id, type:"wheel", wheelId:null, deleted:!!n.deleted, updatedAt:n.updatedAt||now(),
      data:{
        name: d.name || "Untitled wheel",
        desc: d.desc || "",
        order: d.order ?? 0,
        createdAt: d.createdAt || now(),
        spins: d.spins ?? 0,
        opts: (()=>{
          const o = { ...DEFAULT_OPTS, ...(d.opts||{}) };
          o.labels = typeof o.labels === "string" ? o.labels !== "never" : o.labels !== false;
          return o;
        })(),
        history: Array.isArray(d.history) ? d.history.slice(0,MAX_HISTORY) : [],
      },
    };
  }
  return {
    id:n.id, type:"slice", wheelId:n.wheelId||null, deleted:!!n.deleted, updatedAt:n.updatedAt||now(),
    data:{
      name: d.name || "",
      image: d.image || "",
      credit: d.credit || null,
      note: d.note || "",
      color: d.color || "",
      weight: Number.isFinite(+d.weight) && +d.weight > 0 ? +d.weight : 1,
      enabled: d.enabled !== false,
      hits: d.hits ?? 0,
      spot: Number.isFinite(+d.spot) ? +d.spot : rnd(),
      createdAt: d.createdAt || now(),
    },
  };
}

const persist = debounce(()=>{
  try{ localStorage.setItem(LS.data, JSON.stringify(DB.all())); }
  catch(err){ console.warn("local save failed", err); toast("This device is out of storage — trim some images","err"); }
}, 240);

function loadLocal(){
  let raw = [];
  try{ raw = JSON.parse(localStorage.getItem(LS.data)||"[]"); }catch{ raw = []; }
  raw.forEach(n=>{
    const norm = normalize(n);
    (norm.type==="wheel" ? DB.wheels : DB.slices).set(norm.id, norm);
  });
}

/* ------------------------------------------------------------------- prefs */
const Prefs = {
  _c:null,
  get(){ if(!this._c){ try{ this._c=JSON.parse(localStorage.getItem(LS.prefs))||{}; }catch{ this._c={}; } } return this._c; },
  set(k,v){ const p=this.get(); p[k]=v; try{ localStorage.setItem(LS.prefs,JSON.stringify(p)); }catch{} },
};
const prefOn = (k, dflt=true) => { const v = Prefs.get()[k]; return v===undefined ? dflt : !!v; };

/* ============================================================================
   CLOUD (Supabase) — optional. Table `wheel_nodes`, one row per node.
   ============================================================================ */
/** Supabase's dashboard shows several forms of the project URL. The client
 *  wants the bare origin, so trim the REST/auth suffixes people paste in. */
function sanitizeSupabaseUrl(raw){
  let u = String(raw||"").trim();
  u = u.replace(/\/+$/,"");
  u = u.replace(/\/(rest|auth|storage|realtime)\/v\d+.*$/i,"");
  return u.replace(/\/+$/,"");
}

const Cloud = {
  cfg:null, client:null, status:"off", statusMsg:"", chan:null, _queue:[], _libLoading:null,

  init(){
    try{ this.cfg = JSON.parse(localStorage.getItem(LS.cloud)||"null"); }catch{ this.cfg=null; }
    try{ this._queue = JSON.parse(localStorage.getItem(LS.queue)||"[]"); }catch{ this._queue=[]; }
    if(this.cfg && this.cfg.url && this.cfg.key) this.connect();
    else this.setStatus("off");
  },

  setStatus(s,msg){ this.status=s; this.statusMsg=msg||""; refreshSyncChip(); },

  async loadLib(){
    if(window.supabase && window.supabase.createClient) return true;
    if(this._libLoading) return this._libLoading;
    this._libLoading = new Promise(res=>{
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
      s.onload = ()=>res(!!(window.supabase&&window.supabase.createClient));
      s.onerror = ()=>res(false);
      document.head.appendChild(s);
    });
    return this._libLoading;
  },

  async connect(){
    this.setStatus("connecting");
    const ok = await this.loadLib();
    if(!ok){ this.setStatus("err","Could not load the sync library (offline?)"); return; }
    try{
      const url = sanitizeSupabaseUrl(this.cfg.url);
      if(url !== this.cfg.url){            // repair a previously saved bad URL
        this.cfg.url = url;
        localStorage.setItem(LS.cloud, JSON.stringify(this.cfg));
      }
      this.client = window.supabase.createClient(url, this.cfg.key, {
        realtime:{ params:{ eventsPerSecond:8 } },
        auth:{ persistSession:false },
      });
      await this.pull();
      this.subscribe();
      this.setStatus("on");
      this.flush();
    }catch(err){
      console.error(err);
      this.setStatus("err", err.message||"Connection failed");
    }
  },

  async pull(){
    const { data, error } = await this.client.from("wheel_nodes").select("*");
    if(error) throw error;
    (data||[]).forEach(applyRow);
    persist(); scheduleRender();
  },

  subscribe(){
    if(this.chan) try{ this.client.removeChannel(this.chan); }catch{}
    this.chan = this.client.channel("wheel-sync")
      .on("postgres_changes", { event:"*", schema:"public", table:"wheel_nodes" }, payload=>{
        const row = payload.new;
        // Guard against truncated / oversized realtime payloads: refetch instead
        // of poisoning the store with partial data.
        if(payload.errors || !row || !row.id || !row.data){ this.pull().catch(()=>{}); return; }
        if(row.client_id === DB.clientId) return;
        applyRow(row); persist(); scheduleRender();
      })
      .subscribe(status=>{
        if(status==="SUBSCRIBED") this.setStatus("on");
        else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT") this.setStatus("err","Realtime disconnected");
      });
  },

  push(node){
    if(!this.cfg) return;
    this._queue = this._queue.filter(q=>q.id!==node.id);
    this._queue.push(toRow(node));
    try{ localStorage.setItem(LS.queue, JSON.stringify(this._queue)); }catch{}
    this.flushSoon();
  },

  flushSoon:null, // assigned below

  async flush(){
    if(!this.client || !this._queue.length) return;
    const batch = this._queue.slice();
    this.setStatus("saving");
    const { error } = await this.client.from("wheel_nodes").upsert(batch, { onConflict:"id" });
    if(error){
      console.warn("sync failed", error);
      this.setStatus("err", error.message);
      return; // queue is preserved; retried on next change or reconnect
    }
    this._queue = this._queue.filter(q=>!batch.find(b=>b.id===q.id && b.updated_at===q.updated_at));
    try{ localStorage.setItem(LS.queue, JSON.stringify(this._queue)); }catch{}
    this.setStatus("on");
  },

  save(cfg){
    localStorage.setItem(LS.cloud, JSON.stringify(cfg));
    this.cfg = cfg;
    if(cfg && cfg.url && cfg.key) this.connect(); else this.setStatus("off");
  },

  disconnect(){
    localStorage.removeItem(LS.cloud);
    if(this.chan) try{ this.client.removeChannel(this.chan); }catch{}
    this.cfg=null; this.client=null; this.setStatus("off");
  },

  /** Push every local node — used after first-time setup. */
  async pushAll(){
    if(!this.client) return;
    const rows = DB.all().map(toRow);
    for(let i=0;i<rows.length;i+=100){
      const { error } = await this.client.from("wheel_nodes").upsert(rows.slice(i,i+100), { onConflict:"id" });
      if(error) throw error;
    }
  },

  /** Upload an image file to Supabase Storage; falls back to a data URL. */
  async uploadImage(blob, ext){
    if(!this.client || !this.cfg) return null;
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await this.client.storage.from("wheel-images").upload(path, blob, {
      contentType: blob.type || "image/jpeg", upsert:false,
    });
    if(error){ console.warn("image upload failed", error); return null; }
    const { data } = this.client.storage.from("wheel-images").getPublicUrl(path);
    return data?.publicUrl || null;
  },
};
Cloud.flushSoon = debounce(()=>Cloud.flush(), 700);

function toRow(n){
  return { id:n.id, type:n.type, wheel_id:n.wheelId, data:n.data,
           deleted:!!n.deleted, updated_at:n.updatedAt, client_id:DB.clientId };
}
function applyRow(row){
  DB.put({ id:row.id, type:row.type, wheelId:row.wheel_id, data:row.data,
           deleted:row.deleted, updatedAt:row.updated_at }, { local:false });

/* ============================================================================
   MUTATIONS
   ============================================================================ */
function createWheel(name, seed){
  const id = uid("w");
  const order = DB.wheelList().reduce((m,w)=>Math.max(m,w.data.order??0), 0) + 1;
  DB.put({ id, type:"wheel", data:{ name:name||"Untitled wheel", order, createdAt:now(), opts:{...DEFAULT_OPTS} } });
  (seed||[]).forEach(n=>createSlice(id, n));
  return id;
}
function createSlice(wid, name){
  const id = uid("s");
  DB.put({ id, type:"slice", wheelId:wid,
           data:{ name:String(name||"").trim(), spot:randomSpot(wid), createdAt:now() } });
  return id;
}

/** A spot that drops the new entry into a gap chosen uniformly at random.
 *  Picking a bare rnd() would instead favour whichever gap happens to be
 *  widest, so a run of additions would clump together on the wheel. Only the
 *  new entry gets written — the existing spots never move. */
function randomSpot(wid){
  const spots = DB.slicesOf(wid).map(s=>s.data.spot).sort((a,b)=>a-b);
  if(!spots.length) return rnd();
  const i  = Math.floor(rnd()*(spots.length+1));
  const lo = i === 0 ? 0 : spots[i-1];
  const hi = i === spots.length ? 1 : spots[i];
  return lo + (hi-lo)*rndBetween(0.3, 0.7);
}
/** Mutate a node's data in place and stamp/queue it. */
function patch(id, fn){
  const n = DB.get(id); if(!n) return;
  fn(n.data);
  DB.put(n);
}
function wheelOpts(wid){ return DB.get(wid)?.data.opts || DEFAULT_OPTS; }
function setOpt(wid, k, v){ patch(wid, d=>{ d.opts = { ...DEFAULT_OPTS, ...d.opts, [k]:v }; }); }


/* ------------------------------------------------------------ image intake */
/** Downscale in-browser so rows stay small even without Storage configured. */
function processImage(file, maxDim, quality=0.85){
  maxDim = maxDim || 1400;
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error("read failed"));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("decode failed"));
      img.onload = ()=>{
        let { width:w, height:hh } = img;
        const scale = Math.min(1, maxDim/Math.max(w,hh));
        w = Math.round(w*scale); hh = Math.round(hh*scale);
        const cv = document.createElement("canvas");
        cv.width=w; cv.height=hh;
        cv.getContext("2d").drawImage(img,0,0,w,hh);
        cv.toBlob(b=>{
          if(!b) return reject(new Error("encode failed"));
          resolve({ blob:b, dataUrl:cv.toDataURL("image/jpeg",quality) });
        },"image/jpeg",quality);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** Shrink a chosen file and return a usable src: a Storage URL when we're
 *  synced, otherwise an inline (still downscaled) data URL. */
async function fileToSrc(file, maxDim){
  const { blob, dataUrl } = await processImage(file, maxDim);
  let src = null;
  if(Cloud.client) src = await Cloud.uploadImage(blob,"jpg");
  return src || dataUrl;
}

/** Pick a single image and resolve to its src (null if cancelled/failed). */
function pickOneImage(){
  return new Promise(resolve=>{
    const input = $("#filepick");
    let done = false;
    const finish = v => { if(!done){ done=true; resolve(v); } };
    input.value = "";
    input.onchange = async ()=>{
      const f = (input.files||[])[0];
      if(!f) return finish(null);
      toast("Processing image…");
      try{ finish(await fileToSrc(f)); }
      catch(err){ console.warn(err); toast("Could not read that image","err"); finish(null); }
    };
    // Dismissing the OS dialog fires no 'change' event, which would leave the
    // caller waiting forever — recover once the window is focused again.
    window.addEventListener("focus", ()=>{
      setTimeout(()=>{ if(!(input.files||[]).length) finish(null); }, 400);
    }, { once:true });
    input.click();
  });
}

/* ============================================================================
   PICTURE SOURCES
   Two catalogues that need no API key and no sign-up. Google has no keyless
   image API, so pasting or dragging (below) is the route for anything these
   two don't carry.
   ============================================================================ */
/** A normal web image search, for the pictures the open catalogues don't
 *  carry. Opened in a tab you copy or drag out of — the results themselves
 *  can't be read from here, and shouldn't be scraped. */
const WEB_SEARCHES = [
  { key:"google", label:"Google Images", url:q=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q) },
  { key:"bing",   label:"Bing Images",   url:q=>"https://www.bing.com/images/search?q="+encodeURIComponent(q) },
  { key:"ddg",    label:"DuckDuckGo",    url:q=>"https://duckduckgo.com/?iax=images&ia=images&q="+encodeURIComponent(q) },
];
function webSearchFor(name){
  const key = Prefs.get().webSearch || "google";
  const eng = WEB_SEARCHES.find(e=>e.key===key) || WEB_SEARCHES[0];
  window.open(eng.url(name||""), "_blank", "noopener");
}
const webSearchName = () =>
  (WEB_SEARCHES.find(e=>e.key===(Prefs.get().webSearch||"google")) || WEB_SEARCHES[0]).label;

/** Prefer the API's own explanation over a bare status code. */
async function detailOf(r){
  try{
    const j = await r.clone().json();
    if(j && (j.detail || j.error)) return String(j.detail || j.error?.info || j.error);
  }catch{}
  return "search failed (" + r.status + ")";
}

const ImageSearch = {
  async commons(q){
    const url = "https://commons.wikimedia.org/w/api.php?" + new URLSearchParams({
      action:"query", generator:"search", gsrsearch:`filetype:bitmap ${q}`,
      gsrlimit:"28", gsrnamespace:"6", prop:"imageinfo",
      iiprop:"url|extmetadata", iiurlwidth:"320", format:"json", origin:"*",
    });
    const r = await fetch(url);
    if(!r.ok) throw new Error("Wikimedia: " + (await detailOf(r)));
    const j = await r.json();
    const pages = Object.values(j?.query?.pages || {});
    pages.sort((a,b)=>(a.index??0)-(b.index??0));
    return pages.map(pg=>{
      const ii = (pg.imageinfo||[])[0] || {};
      const meta = ii.extmetadata || {};
      const strip = v => String(v||"").replace(/<[^>]*>/g,"").trim();
      return {
        id: "c"+pg.pageid,
        title: (pg.title||"").replace(/^File:/,"").replace(/\.[a-z0-9]+$/i,""),
        thumb: ii.thumburl,
        full:  ii.thumburl,          // the 320px render is plenty for a wedge
        licence: strip(meta.LicenseShortName?.value) || "Wikimedia",
        creator: strip(meta.Artist?.value),
        page: ii.descriptionurl,
      };
    }).filter(x=>x.thumb);
  },

  async openverse(q){
    const url = "https://api.openverse.org/v1/images/?" + new URLSearchParams({
      // 20 is the ceiling Openverse allows without an API token
      q, page_size:"20", mature:"false",
    });
    const r = await fetch(url);
    if(r.status === 429) throw new Error("Openverse is rate-limiting anonymous searches — try Wikimedia");
    if(!r.ok) throw new Error("Openverse: " + (await detailOf(r)) );
    const j = await r.json();
    return (j.results||[]).map(x=>({
      id: "o"+x.id,
      title: x.title || "",
      thumb: x.thumbnail || x.url,
      full:  x.url,                  // original; usually CORS-enabled
      licence: [x.license, x.license_version].filter(Boolean).join(" ").toUpperCase(),
      creator: x.creator || "",
      page: x.foreign_landing_url || "",
    })).filter(x=>x.thumb);
  },
};

/** Pull a found image into the entry. Preferred path is to fetch the bytes and
 *  run them through the same downscale/upload pipeline as a chosen file, so the
 *  picture is permanent and travels with a synced wheel. Some hosts refuse
 *  cross-origin reads, and for those we keep the link instead. */
async function adoptImage(item){
  try{
    const r = await fetch(item.full, { mode:"cors" });
    if(!r.ok) throw new Error(String(r.status));
    const blob = await r.blob();
    if(!blob.type.startsWith("image/")) throw new Error("not an image");
    // Catalogues hand back full-size originals; the biggest this is ever shown
    // is the result card, so 1000px keeps rows small without visible loss.
    return { src: await fileToSrc(blob, 1000), linked:false };
  }catch(err){
    console.warn("could not copy the image, linking instead", err);
    return { src: item.full || item.thumb, linked:true };
  }
}

function creditOf(item){
  const bits = [item.creator, item.licence].filter(Boolean).join(" · ");
  return bits ? { text: bits, url: item.page || "" } : null;
}

/** Every image in a paste or a drop, in order. Handles real files (including
 *  a multi-file drop from the Finder), and the URL you get when dragging or
 *  copying straight out of another browser tab. */
async function imagesFromTransfer(dt){
  let files = [...(dt.files||[])].filter(f=>f.type.startsWith("image/"));
  if(!files.length){
    files = [...(dt.items||[])]
      .filter(i=>i.kind==="file" && i.type.startsWith("image/"))
      .map(i=>i.getAsFile()).filter(Boolean);
  }
  if(files.length){
    const out = [];
    for(const f of files) out.push({ src: await fileToSrc(f, 1000), linked:false });
    return out;
  }

  const html = dt.getData?.("text/html") || "";
  const m = html.match(/<img[^>]+src\s*=\s*["']([^"']+)["']/i);
  const url = (m && m[1]) || dt.getData?.("text/uri-list") || dt.getData?.("text/plain") || "";
  if(/^https?:|^data:image\//i.test(url.trim())) return [ await adoptImage({ full:url.trim() }) ];
  return [];
}
async function imageFromTransfer(dt){ return (await imagesFromTransfer(dt))[0] || null; }

async function applyImage(id, got, item){
  if(!got || !got.src) return false;
  patch(id, d=>{
    d.image = got.src;
    d.credit = item ? creditOf(item) : null;
  });
  // keep any history thumbnail of this entry in step
  const sl = DB.get(id);
  if(sl) patch(sl.wheelId, d=>{ (d.history||[]).forEach(r=>{ if(r.id===id) r.image = got.src; }); });
  return true;
}

/* ============================================================================
   SOUND — synthesised, so the file stays self-contained.
   ============================================================================ */
const Sfx = {
  ctx:null, _lastTick:0,
  ensure(){
    if(!this.ctx){
      const C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      this.ctx = new C();
    }
    if(this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  /** A short wooden click as a peg passes the pointer. On a wheel with
   *  hundreds of wedges the pegs fly past every frame, so hold a floor on the
   *  spacing — otherwise it reads as a buzz rather than a rattle. */
  tick(speed=1){
    if(!prefOn("sound")) return;
    const nowMs = performance.now();
    if(nowMs - this._lastTick < 38) return;
    this._lastTick = nowMs;
    const c = this.ensure(); if(!c) return;
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = "triangle";
    o.frequency.setValueAtTime(1180 + rnd()*260, t);
    o.frequency.exponentialRampToValueAtTime(420, t+0.045);
    f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 1.1;
    const vol = clamp(0.05 + speed*0.05, 0.03, 0.13);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.055);
    o.connect(f).connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.07);
  },
  /** A little fanfare when the wheel settles. */
  win(){
    if(!prefOn("sound")) return;
    const c = this.ensure(); if(!c) return;
    const t0 = c.currentTime;
    [0,4,7,12,16].forEach((semi,i)=>{
      const t = t0 + i*0.085;
      const o = c.createOscillator(), g = c.createGain();
      o.type = i>2 ? "sine" : "triangle";
      o.frequency.value = 392 * Math.pow(2, semi/12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.55);
    });
  },
  blip(){
    if(!prefOn("sound")) return;
    const c = this.ensure(); if(!c) return;
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(660, t);
    o.frequency.exponentialRampToValueAtTime(990, t+0.08);
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t+0.14);
  },
};

/* ============================================================================
   CONFETTI
   ============================================================================ */
function confetti(colors){
  if(!prefOn("confetti")) return;
  const old = $("#confetti"); if(old) old.remove();
  const cv = document.createElement("canvas");
  cv.id = "confetti";
  document.body.appendChild(cv);
  const dpr = Math.min(devicePixelRatio||1, 2);
  const W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+"px"; cv.style.height = H+"px";
  const ctx = cv.getContext("2d");
  ctx.scale(dpr,dpr);

  const pal = colors && colors.length ? colors : PALETTES.carnival.colors;
  const parts = [];
  for(let i=0;i<170;i++){
    parts.push({
      x: W*0.5 + rndBetween(-W*0.22, W*0.22),
      y: H*0.44 + rndBetween(-30, 30),
      vx: rndBetween(-9,9),
      vy: rndBetween(-17,-5),
      w: rndBetween(5,11), hh: rndBetween(7,15),
      rot: rnd()*TAU, vr: rndBetween(-.28,.28),
      c: pal[Math.floor(rnd()*pal.length)],
      life: rndBetween(1.6, 2.9),
      age: 0,
    });
  }
  let last = performance.now();
  (function frame(t){
    const dt = Math.min((t-last)/1000, .05); last = t;
    ctx.clearRect(0,0,W,H);
    let alive = 0;
    for(const p of parts){
      p.age += dt;
      if(p.age > p.life) continue;
      alive++;
      p.vy += 26*dt;         // gravity
      p.vx *= 1 - 0.6*dt;    // drag
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      const a = clamp(1 - (p.age/p.life)*(p.age/p.life), 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.hh/2, p.w, p.hh*Math.abs(Math.cos(p.rot*1.4)));
      ctx.restore();
    }
    if(alive) requestAnimationFrame(frame);
    else cv.remove();
  })(last);
}

/* ============================================================================
   WHEEL GEOMETRY + PAINTING
   ============================================================================ */
/** Choose a colour per slice: an explicit override wins, otherwise cycle the
 *  palette while making sure the last slice never matches the first. */
function paletteOf(opts){ return (PALETTES[opts.palette] || PALETTES.carnival).colors; }

function layout(slices, opts){
  const pal = paletteOf(opts);
  const n = slices.length;
  const total = opts.weighted ? slices.reduce((a,s)=>a + (s.data.weight||1), 0) : n;
  let acc = 0;
  return slices.map((s,i)=>{
    const w = opts.weighted ? (s.data.weight||1) : 1;
    const a0 = (acc/total)*TAU; acc += w;
    const a1 = (acc/total)*TAU;
    // wrap-around clash: the final wedge sits next to the first one
    let ci = i % pal.length;
    if(i === n-1 && n > 1 && ci === 0) ci = pal.length - 1;
    return { slice:s, a0, a1, mid:(a0+a1)/2, span:a1-a0, color: s.data.color || pal[ci] };
  });
}

const norm = a => ((a % TAU) + TAU) % TAU;
/** Which segment currently sits under the pointer. */
function indexAt(segs, rot){
  const a = norm(POINTER - rot);
  for(let i=0;i<segs.length;i++) if(a >= segs[i].a0 && a < segs[i].a1) return i;
  return segs.length ? segs.length-1 : -1;
}

/**
 * Paint one wheel. `o` accepts:
 *   rot      current rotation in radians
 *   labels   draw entry names
 *   hover    index to brighten
 *   winner   index to spotlight
 *   mini     compact styling for gallery previews
 */
function paintWheel(cv, segs, o={}){
  const size = o.size || cv.clientWidth || 300;
  const dpr = Math.min(devicePixelRatio||1, 2.5);
  if(cv.width !== Math.round(size*dpr)){
    cv.width = Math.round(size*dpr); cv.height = Math.round(size*dpr);
    cv.style.width = size+"px"; cv.style.height = size+"px";
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);

  const cx = size/2, cy = size/2;
  const R = size/2 - 1;
  const rimW = o.mini ? Math.max(3, size*0.035) : Math.max(7, size*0.032);
  const R1 = R - rimW;                       // slice radius
  const hubR = (o.mini ? 0.14 : 0.115) * size;
  const rot = o.rot || 0;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);

  if(!segs.length){
    ctx.restore();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.beginPath(); ctx.arc(0,0,R1,0,TAU);
    ctx.fillStyle = "rgba(255,255,255,.03)"; ctx.fill();
    ctx.setLineDash([7,8]);
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
    paintRim(ctx, cx, cy, R, rimW, [], rot, o);
    return;
  }

  /* wedges */
  segs.forEach((s,i)=>{
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R1,s.a0,s.a1);
    ctx.closePath();
    const g = ctx.createRadialGradient(0,0,hubR*0.5,0,0,R1);
    const base = s.color;
    g.addColorStop(0, shade(base, .1));
    g.addColorStop(.72, base);
    g.addColorStop(1, shade(base, -.16));
    ctx.fillStyle = g;
    ctx.fill();
    if(i === o.hover){ ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fill(); }
    if(i === o.winner){
      const a = o.pulse ? 0.10 + 0.10*Math.abs(Math.sin(performance.now()/260)) : 0.13;
      ctx.fillStyle = "rgba(255,255,255,"+a+")";
      ctx.fill();
    }
  });

  /* separators */
  if(segs.length > 1 && segs.length <= 220){
    ctx.lineWidth = Math.max(.7, size*0.0026);
    ctx.strokeStyle = "rgba(10,10,18,.32)";
    segs.forEach(s=>{
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(s.a0)*R1, Math.sin(s.a0)*R1);
      ctx.stroke();
    });
  }

  /* labels */
  if(o.labels){
    const inner = hubR + size*0.028;
    const avail = R1 - inner - size*0.022;             // radial room for the text
    segs.forEach(s=>{
      const name = s.slice.data.name || "—";
      // Two things bound the type size: how thick the wedge is (angular room)
      // and how long the run from rim to hub is (radial room). Take whichever
      // is tighter — the name is never cut short or dropped, only shrunk.
      const arcH = s.span * (R1*0.62);                 // wedge height mid-way out
      let fs = Math.min(size*0.046, arcH*0.62);
      // Text width scales linearly with font size, so one measurement at a
      // reference size gives the exact size that fills `avail`.
      const w = labelWidth(ctx, name);
      if(w > 0) fs = Math.min(fs, avail * LABEL_REF / w);
      if(!(fs > 0.05) || avail <= 0) return;           // wheel smaller than its hub
      ctx.save();
      ctx.rotate(s.mid);
      // A wedge pointing left would carry its label upside down, so turn that
      // half around and run the text the other way. Judged on the *screen*
      // angle, so it stays right way up wherever the wheel comes to rest.
      const screenA = norm(s.mid + (o.rot||0));
      const flip = screenA > Math.PI/2 && screenA < Math.PI*1.5;
      if(flip) ctx.rotate(Math.PI);
      const x = (R1 - size*0.026) * (flip ? -1 : 1);
      ctx.font = `600 ${fs}px ${LABEL_FONT}`;
      ctx.textAlign = flip ? "left" : "right";
      ctx.textBaseline = "middle";
      const ink = inkOn(s.color);
      // Below a few pixels the offset shadow just smudges the glyphs together.
      if(fs >= 9){
        ctx.fillStyle = ink === "rgba(255,255,255,.96)" ? "rgba(0,0,0,.3)" : "rgba(255,255,255,.28)";
        ctx.fillText(name, x, size*0.0035*(flip?-1:1));
      }
      ctx.fillStyle = ink;
      ctx.fillText(name, x, 0);
      ctx.restore();
    });
  }

  if(o.mini){
    // No live hub element sits over a preview, so paint a small solid one.
    ctx.beginPath(); ctx.arc(0,0,hubR,0,TAU);
    ctx.fillStyle = "#141724"; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.stroke();
  }else{
    /* inner vignette so the hub sits in a well */
    const vg = ctx.createRadialGradient(0,0,hubR*0.85,0,0,hubR*2.0);
    vg.addColorStop(0,"rgba(0,0,0,.42)");
    vg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.beginPath(); ctx.arc(0,0,hubR*2.0,0,TAU);
    ctx.fillStyle = vg; ctx.fill();
  }

  ctx.restore();
  paintRim(ctx, cx, cy, R, rimW, segs, rot, o);
}

function paintRim(ctx, cx, cy, R, rimW, segs, rot, o){
  ctx.save();
  ctx.translate(cx,cy);
  const rMid = R - rimW/2;
  const g = ctx.createLinearGradient(-R,-R,R,R);
  g.addColorStop(0,"#3a4166");
  g.addColorStop(.32,"#171b2c");
  g.addColorStop(.55,"#4a5382");
  g.addColorStop(.8,"#1b2033");
  g.addColorStop(1,"#39406a");
  ctx.beginPath(); ctx.arc(0,0,rMid,0,TAU);
  ctx.lineWidth = rimW; ctx.strokeStyle = g; ctx.stroke();

  ctx.beginPath(); ctx.arc(0,0,R-0.6,0,TAU);
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R-rimW+0.6,0,TAU);
  ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.stroke();

  /* pegs at the wedge boundaries — these are what the pointer ticks against */
  if(segs.length > 1 && segs.length <= 46 && !o.mini){
    const pr = Math.max(1.6, rimW*0.19);
    segs.forEach(s=>{
      const a = s.a0 + rot;
      const x = Math.cos(a)*rMid, y = Math.sin(a)*rMid;
      ctx.beginPath(); ctx.arc(x,y,pr,0,TAU);
      ctx.fillStyle = "#e8ecf6"; ctx.fill();
      ctx.beginPath(); ctx.arc(x - pr*0.28, y - pr*0.3, pr*0.42, 0, TAU);
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fill();
    });
  }
  ctx.restore();
}

/* ============================================================================
   SPIN ENGINE
   ============================================================================ */
const WINNER_PULSE_MS = 6000;   // how long the winning wedge breathes for
const winnerPulsing = () => UI.winner >= 0 && Date.now() - UI.winnerAt < WINNER_PULSE_MS;

const Spin = {
  raf:0, running:false, lastIdx:-1,

  start(wid, cv){
    if(this.running) return;
    const wheel = DB.get(wid); if(!wheel) return;
    const opts = wheel.data.opts;
    const live = DB.liveOf(wid);
    if(!live.length){ toast("Add something to the wheel first"); return; }

    Sfx.ensure();
    const segs = layout(live, opts);
    const rot0 = norm(UI.rot);

    // Pick the landing point by sampling the wheel itself, so a weighted wheel
    // is fair by construction rather than by a parallel probability table.
    const pick = rnd()*TAU;
    let idx = segs.findIndex(s=>pick >= s.a0 && pick < s.a1);
    if(idx < 0) idx = segs.length-1;
    const s = segs[idx];
    const pad = Math.min(s.span*0.14, 0.03);
    const target = clamp(pick, s.a0+pad, s.a1-pad);

    const turns = 4 + Math.floor(rnd()*4);
    const dur = clamp(+opts.duration || 5.5, 2, 14) * 1000;
    const delta = norm(POINTER - target - rot0) + TAU*turns;

    this.running = true;
    this.lastIdx = indexAt(segs, rot0);
    UI.winner = -1;
    renderStageChrome();

    const t0 = performance.now();
    const step = t => {
      const x = clamp((t-t0)/dur, 0, 1);
      const e = 1 - Math.pow(1-x, 4.2);              // long, smooth deceleration
      UI.rot = rot0 + delta*e;
      const i = indexAt(segs, UI.rot);
      if(i !== this.lastIdx){
        this.lastIdx = i;
        Sfx.tick(1-x);
        tickPointer();
      }
      paintWheel(cv, segs, { rot:UI.rot, labels:showLabels(opts) });
      if(x < 1){ this.raf = requestAnimationFrame(step); }
      else{
        UI.rot = norm(rot0 + delta);
        this.running = false;
        this.finish(wid, segs, idx);
      }
    };
    this.raf = requestAnimationFrame(step);
  },

  finish(wid, segs, idx){
    const seg = segs[idx];
    const node = seg.slice;
    UI.winner = idx;
    UI.winnerAt = Date.now();
    patch(node.id, d=>{ d.hits = (d.hits||0) + 1; });
    if(DB.get(wid).data.opts.eliminate){
      patch(node.id, d=>{ d.enabled = false; });
      UI.winner = -1;               // the wedge is about to stop existing
    }
    patch(wid, d=>{
      d.spins = (d.spins||0) + 1;
      d.history = [{ id:node.id, name:node.data.name, image:node.data.image||"", color:seg.color, at:now() },
                   ...(d.history||[])].slice(0, MAX_HISTORY);
    });
    Sfx.win();
    confetti(segs.map(s=>s.color));
    renderStageChrome();
    renderPanel();
    showResult(wid, node.id, seg.color);
  },

  stop(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf=0; this.running=false; },
};

/** Names are always drawn when the option is on — they shrink to fit rather
 *  than dropping out, however many entries the wheel carries. */
const showLabels = opts => opts.labels !== false;
function tickPointer(){
  const p = $(".pointer"); if(!p) return;
  p.classList.add("tick");
  setTimeout(()=>p.classList.remove("tick"), 85);
}

/* ============================================================================
   ROUTER   #/   #/w/:wid
   ============================================================================ */
const Route = { name:"home", wid:null };
function parseHash(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/,""));
  const p = raw.split("/").filter(Boolean);
  if(p[0]==="w" && p[1]) return { name:"wheel", wid:p[1] };
  return { name:"home", wid:null };
}
function go(hash){ location.hash = hash; }
window.addEventListener("hashchange", ()=>{
  Spin.stop();
  Object.assign(Route, parseHash());
  UI.rot = 0; UI.winner = -1; UI.hover = -1; UI.filter = "";
  render();
});
