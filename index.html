   ============================================================================ */
const UI = {
  rot:0, winner:-1, hover:-1,
  tab:"entries", filter:"",
  panelHidden:false,      // desktop: panel collapsed
  panelOpen:false,        // mobile: drawer showing
  present:false,
  wheelSize:0,
  overlay:null,
  winnerAt:0,
};

let renderPending = false;
function scheduleRender(){
  if(renderPending) return; renderPending = true;
  requestAnimationFrame(()=>{ renderPending = false; if(!Spin.running) render(); });
}

function render(){
  const app = $("#app");
  app.innerHTML = topbar() + (Route.name==="wheel" ? viewWheel() : viewHome());
  bindTopbar();
  if(Route.name==="wheel") bindWheel(); else bindHome();
}

/* ------------------------------------------------------------------ topbar */
function topbar(){
  const w = Route.name==="wheel" ? DB.get(Route.wid) : null;

  return `<div class="topbar">
    ${w ? `<button class="btn icon ghost" id="back" title="All wheels (Esc)">${svg("left")}</button>`

       : (Cloud.status==="saving"||Cloud.status==="connecting") ? "sav" : "off";
}
function syncLabel(){
  return { on:"Synced", saving:"Saving…", connecting:"Connecting…", err:"Sync error", off:"This device" }[Cloud.status] || "This device";
}
function syncTitle(){
  if(Cloud.status==="off") return "Saved on this device only — click to set up sharing";
  if(Cloud.status==="err") return "Sync problem: "+(Cloud.statusMsg||"unknown");
  return "Syncing through Supabase — click for settings";
}
function refreshSyncChip(){
  const b = $("#syncbtn"); if(!b) return;
  b.className = "sync "+syncClass();

  b.lastElementChild.textContent = syncLabel();

      <div class="meta">
        <span>${svg("list")}<b>${live}</b>${total>live?` of ${total}`:""}</span>

function bindHome(){
  $$("[data-prev]").forEach(cv=>{
    const w = DB.get(cv.dataset.prev); if(!w) return;
    const segs = layout(DB.liveOf(w.id).slice(0,60), w.data.opts);
    paintWheel(cv, segs, { rot:-0.35, labels:false, mini:true, size:134 });
  });
  $$(".wcard").forEach(c=>{
    c.addEventListener("click", ev=>{

  $$("[data-dup]").forEach(b=>b.addEventListener("click",()=>duplicateWheel(b.dataset.dup)));
  $$("[data-del]").forEach(b=>b.addEventListener("click",()=>confirmDeleteWheel(b.dataset.del)));

/* ============================================================================
   WHEEL VIEW
   ============================================================================ */
function viewWheel(){
  const w = DB.get(Route.wid);
  if(!w || w.deleted){
    return `<div class="view"><div class="scroll"><div class="wrap fade"><div class="empty">
      ${svg("wheel")}<h3>That wheel is gone</h3><p>It may have been deleted on another device.</p>
      <button class="btn primary" onclick="location.hash='#/'">Back to all wheels</button>
    </div></div></div></div>`;
  }
  return `<div class="view"><div class="wv fade">
    <div class="stage" id="stage">
      <div class="stage-top">
        <button class="btn icon sm ghost ${prefOn("sound")?"on":""}" id="sound" title="Sound">${svg(prefOn("sound")?"sound":"mute")}</button>
        <button class="btn icon sm ghost" id="shuffle" title="Reshuffle the wheel">${svg("shuffle")}</button>
        <div class="sp"></div>
        <button class="btn sm ghost" id="hidepanel" title="${UI.panelHidden?"Show the entries panel":"Collapse the entries panel"}">${svg(UI.panelHidden?"list":"right")}</button>
      </div>
      <div class="wheelbox" id="wheelbox">
        <div class="pointer">${pointerSvg()}</div>
        <canvas id="wheel"></canvas>
        <button class="hub" id="hub">SPIN<span class="sub">TAP</span></button>
      </div>
      <button class="btn icon" id="exitpresent" title="Leave presentation mode (Esc)">${svg("x")}</button>
      <div class="stage-foot">
        <button class="spinbtn" id="spinbtn">Spin the wheel</button>
        <div id="lastres">${lastResChip(w)}</div>
      </div>
    </div>

  </div></div>`;
}

/** A quiet reminder of what came up last, sat beside the spin button. */
function lastResChip(w){
  const r = (w.data.history||[])[0];
  if(!r) return "";
  return `<button class="btn sm ghost" id="lastbtn" title="Show it again">
    <span class="dot" style="background:${h(r.color||"var(--brand)")}"></span>
    Last: <b style="color:var(--text);font-weight:600">${h(r.name)}</b>
  </button>`;
}

function pointerSvg(){
  return `<svg viewBox="0 0 42 52" fill="none" aria-hidden="true">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dfe4f3"/><stop offset="1" stop-color="#9aa4c4"/>
    </linearGradient></defs>
    <path d="M21 51 6.5 20.5A15.6 15.6 0 1 1 35.5 20.5L21 51Z" fill="url(#pg)" stroke="rgba(0,0,0,.35)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="21" cy="16.5" r="5.6" fill="#141724" opacity=".85"/>
    <circle cx="21" cy="16.5" r="2.4" fill="#ff6ea9"/>
  </svg>`;
}

function bindWheel(){
  const w = DB.get(Route.wid); if(!w) return;
  const cv = $("#wheel");
  sizeWheel();
  refreshWheel();

  const doSpin = ()=>{ if(!Spin.running) Spin.start(w.id, cv); };
  $("#spinbtn")?.addEventListener("click", doSpin);
  $("#hub")?.addEventListener("click", doSpin);
  cv?.addEventListener("click", doSpin);

  $("#sound")?.addEventListener("click", ()=>{
    const on = !prefOn("sound"); Prefs.set("sound", on);
    if(on){ Sfx.ensure(); Sfx.blip(); }
    render();
  });
  $("#shuffle")?.addEventListener("click", ()=>reshuffleWheel(w.id));
  $("#exitpresent")?.addEventListener("click", togglePresent);
  $("#hidepanel")?.addEventListener("click", ()=>{
    UI.panelHidden = !UI.panelHidden;
    render();
  });

  /* hover tooltip over the wedges */
  cv?.addEventListener("mousemove", ev=>{
    if(Spin.running) return;
    const segs = currentSegs();
    if(!segs.length) return;
    const r = cv.getBoundingClientRect();
    const dx = ev.clientX - (r.left + r.width/2), dy = ev.clientY - (r.top + r.height/2);
    const dist = Math.hypot(dx,dy);
    const i = dist > r.width/2 || dist < r.width*0.12 ? -1
            : (()=>{ const a = norm(Math.atan2(dy,dx) - UI.rot);
                     return segs.findIndex(s=>a>=s.a0 && a<s.a1); })();
    if(i !== UI.hover){ UI.hover = i; refreshWheel(); }
    showTip(i>=0 ? segs[i] : null, ev.clientX, ev.clientY);
  });
  cv?.addEventListener("mouseleave", ()=>{ UI.hover=-1; refreshWheel(); showTip(null); });

  bindPanel();
  if(!window.__wheelResize){
    window.__wheelResize = true;
    window.addEventListener("resize", debounce(()=>{ if(Route.name==="wheel"){ sizeWheel(); refreshWheel(); } }, 90));
  }
}

function currentSegs(){
  const w = DB.get(Route.wid); if(!w) return [];
  return layout(DB.liveOf(w.id), w.data.opts);
}
function sizeWheel(){
  const stage = $("#stage"), box = $("#wheelbox"); if(!stage || !box) return;
  const foot = $(".stage-foot");
  const availH = stage.clientHeight - (foot?foot.offsetHeight:0) - 74;
  const availW = stage.clientWidth - 30;
  UI.wheelSize = clamp(Math.floor(Math.min(availW, availH)), 190, 760);
  box.style.width = UI.wheelSize+"px";
  box.style.height = UI.wheelSize+"px";
}
function refreshWheel(){
  const cv = $("#wheel"); if(!cv) return;
  const w = DB.get(Route.wid); if(!w) return;
  const segs = currentSegs();
  paintWheel(cv, segs, {
    rot:UI.rot, size:UI.wheelSize, hover:UI.hover, winner:UI.winner,
    pulse: winnerPulsing(),
    labels: showLabels(w.data.opts),
  });
  renderStageChrome();
}
function renderStageChrome(){
  const w = DB.get(Route.wid); if(!w) return;
  const n = DB.liveOf(w.id).length;
  const btn = $("#spinbtn"), hub = $("#hub");
  const busy = Spin.running, empty = n === 0;
  if(btn){ btn.disabled = busy || empty; btn.textContent = busy ? "Spinning…" : empty ? "Nothing on the wheel" : "Spin the wheel"; }
  if(hub){ hub.disabled = busy || empty; }
  const t = $("#wname"); if(t) t.innerHTML = h(w.data.name)+`<span class="n">${plural(n,"entry","entries")}</span>`;
  const lr = $("#lastres");
  if(lr){
    const html = busy ? "" : lastResChip(w);
    if(lr.innerHTML !== html){
      lr.innerHTML = html;
      $("#lastbtn")?.addEventListener("click", ()=>{
        const r = (w.data.history||[])[0];
        if(r && DB.get(r.id)) showResult(w.id, r.id, r.color);
      });
    }
  }
  $("#wheelbox")?.classList.toggle("spinning", busy);
}
function showTip(seg, x, y){
  let tip = $("#wtip");
  if(!seg){ tip?.remove(); return; }
  if(!tip){ tip = document.createElement("div"); tip.id="wtip"; tip.className="wtip"; $("#stage").appendChild(tip); }
  const opts = wheelOpts(Route.wid);
  const stage = $("#stage").getBoundingClientRect();
  tip.innerHTML = `<b>${h(seg.slice.data.name||"—")}</b>${opts.weighted?`<span class="w">×${seg.slice.data.weight}</span>`:""}`;
  tip.style.left = (x - stage.left)+"px";
  tip.style.top  = (y - stage.top)+"px";
}
function togglePresent(){
  UI.present = !UI.present;
  document.body.classList.toggle("present", UI.present);
  setTimeout(()=>{ sizeWheel(); refreshWheel(); }, 60);
  if(UI.present) toast("Presentation mode — press F or Esc to exit");
}

/* ============================================================================
   PANEL
   ============================================================================ */
function panelHtml(w){
  const all = DB.slicesOf(w.id);
  const live = all.filter(s=>s.data.enabled!==false);
  const tabs = [
    ["entries","list","Entries", live.length],
    ["history","clock","History", (w.data.history||[]).length],
    ["setup","sliders","Setup", null],
  ];
  return `<div class="ptabs">
      ${tabs.map(([k,ic,label,ct])=>`<button class="ptab ${UI.tab===k?"on":""}" data-tab="${k}">
        ${svg(ic)}<span>${label}</span>${ct!==null&&ct?`<span class="ct">${ct}</span>`:""}</button>`).join("")}
    </div>
    <div class="pbody" id="pbody">${
      UI.tab==="entries" ? tabEntries(w, all) : UI.tab==="history" ? tabHistory(w) : tabSetup(w)
    }</div>
    <div class="pfoot ${UI.tab==="entries"?"":"only-close"}">
      ${UI.tab==="entries" ? `
        ${all.some(s=>!s.data.image) ? `<button class="btn sm primary" id="fillpics">${svg("image")} Add pictures</button>` : ""}

      <div style="flex:1"></div>
      <button class="btn sm primary" id="closepanel">${svg("check")} Done</button>
    </div>`;
}

function tabEntries(w, all){
  const segs = layout(DB.liveOf(w.id), w.data.opts);
  const colorOf = id => segs.find(s=>s.slice.id===id)?.color || "#3a4268";
  const f = UI.filter.trim().toLowerCase();
  const match = s => !f || (s.data.name||"").toLowerCase().includes(f);
  const live = all.filter(s=>s.data.enabled!==false && match(s));
  const off  = all.filter(s=>s.data.enabled===false && match(s));
  const opts = w.data.opts;

  return `<div class="quickadd">
      <input class="inp" id="qadd" placeholder="Add an entry…" autocomplete="off" spellcheck="false">
      <button class="btn primary icon" id="qaddbtn" title="Add">${svg("plus")}</button>
    </div>
    ${all.length > 7 ? `<div class="qfilter">${svg("search")}
      <input id="qfilter" placeholder="Filter ${all.length} entries…" value="${h(UI.filter)}" autocomplete="off">
    </div>` : ""}
    ${live.length ? `<div class="sechead">On the wheel <span class="ct">${live.length}</span>
        <div class="sp"></div>
        <span style="text-transform:none;letter-spacing:0;font-weight:400" title="The wheel itself is in a random order">listed A–Z</span>
      </div>
      <div class="elist" id="elist">${live.map(s=>entryRow(s, colorOf(s.id), opts)).join("")}</div>`
      : `<div class="empty" style="padding:34px 12px">${svg("list")}
          <h3>${all.length?"No matches":"The wheel is empty"}</h3>
          <p>${all.length?"Nothing matches that filter.":"Type a name above and press Enter. Keep going — there's no limit. Entries land in a random spot on the wheel; this list stays in alphabetical order."}</p>
        </div>`}
    ${off.length ? `<div class="sechead">${svg("eyeoff")} Off the wheel <span class="ct">${off.length}</span>
        <div class="sp"></div>
        <button class="btn sm ghost" id="restoreall">${svg("undo")} Restore all</button>
      </div>
      <div class="elist">${off.map(s=>entryRow(s, "#3a4268", opts)).join("")}</div>` : ""}`;
}

function entryRow(s, color, opts){
  const d = s.data;
  const off = d.enabled === false;
  const ini = (d.name||"?").trim().charAt(0).toUpperCase() || "?";
  return `<div class="eitem ${off?"off":""}" data-id="${s.id}">
    <button class="sw" data-img="${s.id}" style="background:${color}" title="Find a picture — or drop one here">
      ${d.image ? `<img src="${h(d.image)}" alt="">` : `<span class="ini">${h(ini)}</span>`}
      <span class="cam">${svg("camera")}</span>
    </button>
    <div class="tx" data-edit="${s.id}" style="cursor:pointer">

/** Any row in the list takes a picture dropped on it — from the Finder, or
 *  dragged straight out of another browser tab. */
function bindRowDrop(){
  $$(".eitem").forEach(el=>{
    const id = el.dataset.id;
    ["dragenter","dragover"].forEach(e=>el.addEventListener(e, ev=>{
      if(![...(ev.dataTransfer?.types||[])].some(t=>/Files|text\/uri-list|text\/html/.test(t))) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = "copy";
      el.classList.add("dropping");
    }));
    ["dragleave","dragend"].forEach(e=>el.addEventListener(e, ()=>el.classList.remove("dropping")));
    el.addEventListener("drop", async ev=>{
      ev.preventDefault();
      el.classList.remove("dropping");
      const got = await imagesFromTransfer(ev.dataTransfer);
      if(!got.length) return toast("No picture in what you dropped","err");
      // several at once walk down the list from the row they landed on
      const rows = $$(".eitem").map(x=>x.dataset.id);
      const from = Math.max(0, rows.indexOf(id));
      let n = 0;
      for(let i=0;i<got.length && from+i<rows.length;i++){
        await applyImage(rows[from+i], got[i], null); n++;
      }
      renderPanel(); refreshWheel();
      toast(n>1 ? `${n} pictures added` : (got[0].linked ? "Picture linked from the web" : "Picture added"), "ok");
    });
  });
}

/** Deal every entry a new spot, rearranging the wedges. The sidebar list is

function reshuffleWheel(wid){
  DB.slicesOf(wid).forEach(sl=>patch(sl.id, d=>{ d.spot = rnd(); }));
  UI.winner = -1;
  renderPanel(); refreshWheel();
  toast("Wheel reshuffled","ok");
}

function showResult(wid, sliceId, color){

  let refit = null;
  const onResize = debounce(()=>{ if(refit) refit(); }, 120);

  const draw = ()=>{
    const cur = DB.get(sliceId).data;
    const off = cur.enabled === false;
    el.innerHTML = `<div class="rescard">
      <div class="glow" style="background:${h(color)}"></div>
      <div class="kicker">The wheel says</div>
      <div class="resimg" style="background:linear-gradient(150deg,${h(shade(color,.16))},${h(shade(color,-.28))})">
        ${cur.image ? `<img class="bg" src="${h(cur.image)}" alt="" aria-hidden="true">
             <img class="main" src="${h(cur.image)}" alt="${h(cur.name)}">` : `<span class="ini">${h(ini)}</span>`}
        <button class="btn sm icon addimg" id="rimg" title="${cur.image?"Change picture":"Add a picture"}">${svg("camera")}</button>
      </div>
      <h2>${h(cur.name || "Untitled")}</h2>
      ${cur.note ? `<div class="note">${h(cur.note)}</div>` : ""}
      ${cur.credit ? `<div class="credit">${cur.credit.url
          ? `<a href="${h(cur.credit.url)}" target="_blank" rel="noreferrer noopener">${h(cur.credit.text)}</a>`
          : h(cur.credit.text)}</div>` : ""}
      <div class="rmeta">
        <span>${svg("dice")}Landed on ${plural(cur.hits||1,"time")}</span>
        ${off ? `<span style="color:var(--warm)">${svg("eyeoff")}Off the wheel</span>` : ""}
        ${w.data.opts.weighted && cur.weight !== 1 ? `<span>${svg("scale")}×${cur.weight}</span>` : ""}
      </div>
      <div class="racts">
        <button class="btn primary wide" id="ragain">${svg("play")} Spin again</button>
        <button class="btn" id="rtoggle">${svg(off?"undo":"eyeoff")} ${off?"Put back":"Take off"}</button>
        <button class="btn" id="redit">${svg("pencil")} Edit</button>
        <button class="btn" id="rclose">Done</button>
      </div>
    </div>`;
    bind();
  };

  const close = ()=>{
    el.remove();
    window.removeEventListener("resize", onResize);
    document.removeEventListener("keydown", key);
    UI.overlay = null;
    renderPanel();
    refreshWheel();
  };
  function key(ev){
    if(ev.key==="Escape"){ ev.preventDefault(); ev.stopPropagation(); close(); }
    else if(ev.key===" " || ev.key==="Enter"){
      if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      ev.preventDefault(); ev.stopPropagation(); again();
    }
  }
  const again = ()=>{ close(); setTimeout(()=>Spin.start(wid, $("#wheel")), 90); };

  /** Give the frame the picture's own proportions so the whole thing shows
   *  without bars. Very tall or very wide pictures stop at the limits and sit
   *  on the blurred copy behind them. */
  function fitImage(){
    const box = $(".resimg", el), main = $(".resimg img.main", el);
    if(!box || !main) return;
    const apply = ()=>{
      // The frame is measured, so wait for it to actually have a width — a
      // background tab reports zero until it is painted.
      const w = box.clientWidth;
      if(!w){ requestAnimationFrame(apply); return; }
      const ar = main.naturalWidth / main.naturalHeight;
      if(ar > 0){
        const wide = clamp(ar, 0.62, 2.1);            // limits for the frame
        const cap = Math.min(innerHeight * 0.46, 400);
        box.style.height = Math.round(clamp(w / wide, 190, cap)) + "px";
      }
      main.classList.add("shown");
    };
    if(main.complete && main.naturalWidth) apply();
    else{
      main.addEventListener("load", apply, { once:true });
      main.addEventListener("error", ()=>main.classList.add("shown"), { once:true });
    }
    // the frame is sized in pixels, so it has to be redone if the window moves
    refit = apply;
  }

  function bind(){
    fitImage();
    $("#rclose",el).addEventListener("click", close);
    $("#ragain",el).addEventListener("click", again);
    $("#redit",el).addEventListener("click", ()=>promptEntry(sliceId, draw));
    $("#rimg",el).addEventListener("click", ()=>openImagePicker(sliceId, draw));
    $("#rtoggle",el).addEventListener("click", ()=>{
      patch(sliceId, x=>{ x.enabled = x.enabled===false; });
      draw();
    });
  }

  el.addEventListener("click", ev=>{ if(ev.target===el) close(); });
  document.addEventListener("keydown", key);
  window.addEventListener("resize", onResize);
  UI.overlay = "result";
  $("#overlays").appendChild(el);
  draw();
}

let modalStack = [];
function openModal(opt){
  const el = document.createElement("div");
  el.className = "ov";
  el.innerHTML = `<div class="modal ${opt.cls||""}">
    <div class="mod-h">
      ${opt.icon?`<div style="width:34px;height:34px;border-radius:10px;background:var(--brand-dim);color:var(--brand-2);display:grid;place-items:center;flex:0 0 34px">${svg(opt.icon)}</div>`:""}
      <div style="flex:1;min-width:0"><h3>${opt.title}</h3>${opt.sub?`<div class="sub">${opt.sub}</div>`:""}</div>
      <button class="btn icon ghost" data-x>${svg("x")}</button>
    </div>
    <div class="mod-b">${opt.body||""}</div>
    <div class="mod-f">
      ${opt.extra||""}<div class="sp"></div>
      ${opt.hideCancel?"":`<button class="btn" data-cancel>${opt.cancelLabel||"Cancel"}</button>`}
      <button class="btn ${opt.danger?"danger":"primary"}" data-ok>${opt.okLabel||"OK"}</button>
    </div>
  </div>`;
  const root = $(".modal",el);
  const close = ran=>{
    el.remove();
    modalStack = modalStack.filter(m=>m.el!==el);
    document.removeEventListener("keydown",key);
    if(!ran) opt.onCancel && opt.onCancel();
    opt.onClose && opt.onClose();
  };
  const ok = ()=>{ const r = opt.onOk ? opt.onOk(root) : true; if(r!==false) close(true); };
  $("[data-ok]",root).addEventListener("click",ok);
  $("[data-x]",root).addEventListener("click",()=>close(false));
  $("[data-cancel]",root)?.addEventListener("click",()=>close(false));
  el.addEventListener("click",ev=>{ if(ev.target===el) close(false); });
  function key(ev){
    if(ev.key==="Escape"){ ev.preventDefault(); ev.stopPropagation(); close(false); }
    if(ev.key==="Enter" && !ev.shiftKey){
      if(ev.target.tagName==="TEXTAREA") return;
      ev.preventDefault(); ev.stopPropagation(); ok();
    }
  }
  document.addEventListener("keydown",key);
  modalStack.push({el,close});
  $("#overlays").appendChild(el);
  opt.onOpen && opt.onOpen(root);
  return { close, el, root };
}
function closeModal(){ const m = modalStack[modalStack.length-1]; if(m) m.close(false); }
function confirmModal(opt){
  openModal({ ...opt, icon:opt.icon||"trash", onOk(){ opt.onOk && opt.onOk(); return true; } });
}

function duplicateWheel(id){

  const nid = uid("w");

  DB.put({ id:nid, type:"wheel", data:{ ...JSON.parse(JSON.stringify(w.data)),
    name: w.data.name+" (copy)", order, createdAt:now(), spins:0, history:[] } });
  DB.slicesOf(id).forEach(s=>{
    DB.put({ id:uid("s"), type:"slice", wheelId:nid, data:{ ...JSON.parse(JSON.stringify(s.data)), hits:0, createdAt:now() } });
  });
  render();
  toast("Wheel duplicated","ok");
}

            <button class="btn sm" id="ipick">${svg("camera")} ${img?"Replace":"Choose a picture"}</button>
            ${img?`<button class="btn sm danger" id="idel">${svg("trash")} Remove</button>`:""}
          </div>
        </div>
        <div class="hint">Shown large when the wheel lands on this entry.</div>
      </div>
      <div class="field">
        <label>Note <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
        <textarea class="inp" id="eo" style="min-height:64px" placeholder="Anything to show alongside the result">${h(s.data.note)}</textarea>
      </div>
      <div class="field">
        <label>Slice colour</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="color" id="ec" value="${h(s.data.color || "#8b7cff")}" style="width:46px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--bg-2);padding:2px;cursor:pointer">
          <button class="btn sm" id="ecauto">${svg("sparkle")} Use the palette</button>
          <span style="font-size:12px;color:var(--text-3)" id="eclab">${s.data.color?"Custom":"Palette: "+(PALETTES[opts.palette]?.label||"")}</span>
        </div>
      </div>`,
    extra:`<button class="btn danger sm" id="edel">${svg("trash")} Delete</button>`,
    okLabel:"Save",
    onOpen(root){
      setTimeout(()=>{ $("#en",root).focus(); $("#en",root).select(); },30);
      let custom = !!s.data.color;
      const ec = $("#ec",root);
      ec.addEventListener("input", ()=>{ custom = true; $("#eclab",root).textContent = "Custom"; });
      $("#ecauto",root).addEventListener("click", ()=>{
        custom = false; $("#eclab",root).textContent = "Palette: "+(PALETTES[opts.palette]?.label||"");
      });
      root.__custom = ()=>custom;
      $("#ipick",root).addEventListener("click", ()=>{
        // the picker writes straight through to the entry, so mirror it here
        openImagePicker(id, ()=>{
          img = DB.get(id)?.data.image || "";
          const pv = $("#ip",root);
          pv.classList.toggle("has", !!img);
          pv.innerHTML = img ? `<img src="${h(img)}" alt="">` : svg("image")+"<span>No picture yet</span>";
          $("#ipick",root).innerHTML = svg("camera")+(img?" Replace":" Choose a picture");
        });
      });
      $("#idel",root)?.addEventListener("click", ()=>{
        img = "";
        const p = $("#ip",root);
        p.classList.remove("has");
        p.innerHTML = svg("image")+"<span>No picture yet</span>";
        $("#idel",root).remove();
        $("#ipick",root).innerHTML = svg("camera")+" Choose a picture";
      });
      $("#edel",root).addEventListener("click", ()=>{
        DB.remove(id); closeModal(); renderPanel(); refreshWheel(); toast("Entry deleted");
      });
    },
    onOk(root){
      const name = $("#en",root).value.trim();
      if(!name){ toast("An entry needs a name","err"); return false; }
      const weight = clamp(parseFloat($("#ew",root).value)||1, 0.1, 999);
      const custom = root.__custom();
      patch(id, d=>{
        d.name = name; d.weight = weight; d.image = img;
        d.note = $("#eo",root).value.trim();
        d.color = custom ? $("#ec",root).value : "";
      });
      renderPanel(); refreshWheel();
      if(after) after();
      return true;
    }
  });
}

/* ---------------------------------------------------------- picture picker */
/** One surface for putting a picture on an entry: search two keyless
 *  catalogues, paste, drag, or pick a file. `after` runs on every change so a
 *  caller's own preview can follow along. */
function openImagePicker(id, after){
  const entry = DB.get(id); if(!entry) return;
  let src = Prefs.get().imgSource === "openverse" ? "openverse" : "commons";
  let results = [], state = "idle", errMsg = "", query = entry.data.name || "";
  let seq = 0;                       // drops responses from superseded searches

  const missing = () => DB.slicesOf(entry.wheelId).filter(x=>!x.data.image && x.id!==id);

  const modal = openModal({
    cls:"wide", icon:"image",
    title:"Picture for “"+h(entry.data.name||"this entry")+"”",
    okLabel:"Done", hideCancel:true,
    body:`<div class="isbar">
        <span class="isfield">${svg("search","ic")}
          <input id="isq" value="${h(query)}" placeholder="Search for a picture…" autocomplete="off" spellcheck="false">
        </span>
        <div class="pick-src">
          <button data-src="commons" class="${src==="commons"?"on":""}">Wikimedia</button>
          <button data-src="openverse" class="${src==="openverse"?"on":""}">Openverse</button>
        </div>
      </div>
      <div id="isout"></div>
      <div class="isfoot" id="isfoot"></div>`,
    extra:`<button class="btn sm" id="isweb">${svg("external")} ${h(webSearchName())}</button>
      <button class="btn sm" id="isfile">${svg("camera")} From this computer</button>
      <button class="btn sm danger ${entry.data.image?"":"hidden"}" id="isclear">${svg("trash")} Remove</button>`,
    onOpen(root){ boot(root); },
    onClose(){ document.removeEventListener("paste", onPaste, true); },
  });

  /* ---- rendering */
  function draw(root){
    const out = $("#isout", root);
    if(state === "loading"){
      out.innerHTML = `<div class="isstate"><span class="spin" style="width:22px;height:22px"></span>Searching…</div>`;
    }else if(state === "error"){
      out.innerHTML = `<div class="isstate">${svg("info")}${h(errMsg)}</div>`;
    }else if(state === "done" && !results.length){
      out.innerHTML = `<div class="isstate">${svg("search")}Nothing found for “${h(query)}”.<br>Try fewer words, or the other catalogue.</div>`;
    }else if(state === "done"){
      out.innerHTML = `<div class="isgrid">${results.map((r,i)=>`
        <button class="iscard" data-i="${i}" title="${h(r.title)}${r.licence?" — "+h(r.licence):""}">
          <img src="${h(r.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">
          <span class="cap">
            ${r.title?`<b>${h(r.title)}</b>`:""}
            ${r.licence?`<i>${h(r.licence)}</i>`:""}
          </span>
        </button>`).join("")}</div>`;
      $$(".iscard", out).forEach(b=>{
        b.addEventListener("click", ()=>choose(root, b, results[+b.dataset.i]));
        const im = $("img", b);
        im.addEventListener("load", ()=>b.classList.add("ready"));
        // a catalogue occasionally lists a picture its host no longer serves;
        // drop the tile rather than leaving a hole in the grid
        im.addEventListener("error", ()=>b.remove());
        if(im.complete && im.naturalWidth) b.classList.add("ready");
      });
    }else{
      out.innerHTML = `<div class="isstate">${svg("search")}Search for a picture, paste one with <kbd>${PASTE_KEY}</kbd>,<br>or drag one in from another tab.</div>`;
    }

    const n = missing().length;
    $("#isfoot", root).innerHTML =
      `<span><kbd>${PASTE_KEY}</kbd> to paste, or drag one in</span><span class="sp"></span>` +
      (n ? `<button id="isnext">Fill the other ${n} ${svg("right")}</button>` : "");
    $("#isnext", root)?.addEventListener("click", ()=>{
      modal.close();
      openFillPictures(entry.wheelId);
    });
    showCurrent(root);
  }

  /** Swap the dialog's header glyph for the entry's actual picture, so the
   *  current state is visible without spending a row on it. */
  function showCurrent(root){
    const slot = $(".mod-h > div", root);
    if(!slot) return;
    const cur = DB.get(id)?.data.image;
    const shown = slot.dataset.shown || "";
    if(cur === shown) return;
    slot.dataset.shown = cur || "";
    slot.innerHTML = cur ? `<img class="ishead-img" src="${h(cur)}" alt="">` : svg("image");
  }

  async function run(root){
    const my = ++seq;
    const q = query.trim();
    if(!q){ state="idle"; results=[]; return draw(root); }
    state = "loading"; draw(root);
    try{
      const r = await ImageSearch[src](q);
      if(my !== seq) return;
      results = r; state = "done";
    }catch(err){
      if(my !== seq) return;
      state = "error"; errMsg = err.message || "That search didn't work";
    }
    draw(root);
  }

  async function choose(root, btn, item){
    btn.classList.add("busy");
    const got = await adoptImage(item);
    await applyImage(id, got, item);
    btn.classList.remove("busy");
    settled(root, got.linked ? "Picture linked from the web" : "Picture added");
  }

  function settled(root, msg){
    toast(msg, "ok");
    renderPanel(); refreshWheel();
    if(after) after();
    $("#isclear", root)?.classList.toggle("hidden", !DB.get(id)?.data.image);
    draw(root);
  }

  /* ---- paste, drag, file */
  // declared, not assigned, so `boot` can wire it up while openModal is still
  // running its onOpen hook
  async function onPaste(ev){
    const got = await imageFromTransfer(ev.clipboardData);
    if(!got) return;
    ev.preventDefault(); ev.stopPropagation();
    await applyImage(id, got, null);
    settled(modal.root, got.linked ? "Picture linked from the web" : "Picture pasted");
  }

  function boot(root){
    document.addEventListener("paste", onPaste, true);

    const q = $("#isq", root);
    setTimeout(()=>{ q.focus({ preventScroll:true }); q.select(); }, 40);
    q.addEventListener("keydown", ev=>{
      if(ev.key === "Enter"){ ev.preventDefault(); ev.stopPropagation(); query = q.value; run(root); }
    });
    q.addEventListener("input", debounce(()=>{ query = q.value; run(root); }, 420));

    $$("[data-src]", root).forEach(b=>b.addEventListener("click", ()=>{
      src = b.dataset.src;
      Prefs.set("imgSource", src);
      $$("[data-src]", root).forEach(x=>x.classList.toggle("on", x.dataset.src===src));
      run(root);
    }));

    // Anywhere on the dialog takes a drop. The prompt only appears while
    // something is actually being dragged over it, so it costs no layout.
    const ov = document.createElement("div");
    ov.className = "isover";
    ov.innerHTML = `<div>${svg("image")}<span>Drop the picture anywhere</span></div>`;
    root.appendChild(ov);
    // dragleave also fires moving between children, so count enters and exits
    let depth = 0;
    const carriesImage = ev =>
      [...(ev.dataTransfer?.types||[])].some(t=>/Files|text\/uri-list|text\/html/.test(t));
    root.addEventListener("dragenter", ev=>{
      if(!carriesImage(ev)) return;
      ev.preventDefault(); depth++; ov.classList.add("on");
    });
    root.addEventListener("dragover", ev=>{
      if(!carriesImage(ev)) return;
      ev.preventDefault(); ev.dataTransfer.dropEffect = "copy";
    });
    root.addEventListener("dragleave", ()=>{ if(--depth <= 0){ depth = 0; ov.classList.remove("on"); } });
    root.addEventListener("drop", async ev=>{
      ev.preventDefault(); depth = 0; ov.classList.remove("on");
      const got = await imageFromTransfer(ev.dataTransfer);
      if(!got) return toast("No picture in what you dropped","err");
      await applyImage(id, got, null);
      settled(root, got.linked ? "Picture linked from the web" : "Picture added");
    });

    $("#isweb", root)?.addEventListener("click", ()=>{
      webSearchFor($("#isq", root).value.trim() || entry.data.name);
    });
    $("#isfile", root)?.addEventListener("click", async ()=>{
      const s2 = await pickOneImage();
      if(!s2) return;
      await applyImage(id, { src:s2, linked:false }, null);
      settled(root, "Picture added");
    });
    $("#isclear", root)?.addEventListener("click", ()=>{
      patch(id, d=>{ d.image = ""; d.credit = null; });
      renderPanel(); refreshWheel(); if(after) after();
      $("#isclear", root).classList.add("hidden");
      draw(root);
      toast("Picture removed");
    });

    if(query.trim()) run(root); else draw(root);
  }
}

/* ------------------------------------------------------------- fill mode */
/**
 * Walk the entries that have no picture, one screen at a time. The loop is
 * meant to be: open the web search, copy a picture, paste. Pasting fills the
 * entry and moves straight to the next, so a whole wheel is a run of ⌘V.
 */
function openFillPictures(wid, startId){
  const pending = () => DB.slicesOf(wid).filter(s=>!s.data.image && !skipped.has(s.id));
  const skipped = new Set();
  const total = DB.slicesOf(wid).filter(s=>!s.data.image).length;
  if(!total){ toast("Every entry already has a picture","ok"); return; }

  let cur = startId && DB.get(startId) && !DB.get(startId).data.image ? startId : (pending()[0]||{}).id;
  let busy = false;

  const modal = openModal({
    icon:"image", title:"Add pictures", sub:`${total} to go`,
    okLabel:"Done", hideCancel:true,
    extra:`<button class="btn sm" id="fillskip">Skip this one</button>`,
    body:`<div id="fillbody"></div>`,
    onOpen(root){
      document.addEventListener("paste", onPaste, true);
      $("#fillskip", root).addEventListener("click", ()=>{
        if(cur) skipped.add(cur);
        advance(); draw(root);
      });
      draw(root);
    },
    onClose(){
      document.removeEventListener("paste", onPaste, true);
      renderPanel(); refreshWheel();
    },
  });

  function advance(){
    const left = pending();
    cur = left.length ? left[0].id : null;
  }

  function draw(root){
    const box = $("#fillbody", root);
    const left = pending().length;
    const filled = total - DB.slicesOf(wid).filter(s=>!s.data.image).length;
    const pct = total ? Math.round(filled/total*100) : 100;

    if(!cur || !left){
      box.innerHTML = `<div class="fill-prog"><i style="width:${pct}%"></i></div>
        <div class="fill-done">${svg("check")}
          <div><b>${filled} of ${total}</b> filled${skipped.size?` · ${skipped.size} skipped`:""}</div>
        </div>`;
      const s2 = $(".mod-h .sub", root); if(s2) s2.textContent = "Finished";
      $("#fillskip", root)?.classList.add("hidden");
      return;
    }

    const entry = DB.get(cur);
    box.innerHTML = `<div class="fill-prog"><i style="width:${pct}%"></i></div>
      <div class="fill-for">Picture ${Math.min(filled+1,total)} of ${total}</div>
      <div class="fill-name">${h(entry.data.name || "Untitled")}</div>
      <div class="fill-zone" id="fillzone">${svg("image")}
        <div>Copy a picture, then press <kbd>${PASTE_KEY}</kbd><br>or drag one in from another tab</div>
      </div>
      <div class="fill-acts">
        <button class="btn primary" id="fillweb">${svg("external")} ${h(webSearchName())}</button>
        <button class="btn" id="fillfile">${svg("camera")} From this computer</button>
        <button class="btn" id="fillcat">${svg("search")} Catalogues</button>
      </div>
      ${skipped.size?`<div class="fill-skipped">${skipped.size} skipped — they stay on the wheel without a picture.</div>`:""}`;

    const sub = $(".mod-h .sub", root);
    if(sub) sub.textContent = `${left} still to go`;

    $("#fillweb", root).addEventListener("click", ()=>webSearchFor(entry.data.name));
    $("#fillfile", root).addEventListener("click", async ()=>{
      const src = await pickOneImage();
      if(!src) return;
      await applyImage(cur, { src, linked:false }, null);
      took(root, "Picture added");
    });
    $("#fillcat", root).addEventListener("click", ()=>{
      const target = cur;
      modal.close();
      openImagePicker(target, ()=>{});
    });

    const zone = $("#fillzone", root);
    let depth = 0;
    const carries = ev => [...(ev.dataTransfer?.types||[])].some(t=>/Files|text\/uri-list|text\/html/.test(t));
    zone.addEventListener("dragenter", ev=>{ if(carries(ev)){ ev.preventDefault(); depth++; zone.classList.add("over"); } });
    zone.addEventListener("dragover",  ev=>{ if(carries(ev)){ ev.preventDefault(); ev.dataTransfer.dropEffect="copy"; } });
    zone.addEventListener("dragleave", ()=>{ if(--depth<=0){ depth=0; zone.classList.remove("over"); } });
    zone.addEventListener("drop", async ev=>{
      ev.preventDefault(); depth=0; zone.classList.remove("over");
      if(busy) return;
      busy = true;
      const dt = ev.dataTransfer;
      const count = (dt.files||[]).length || 1;
      working(true, count);
      try{ await take(root, await imagesFromTransfer(dt)); }
      finally{ busy = false; }
    });
  }

  /** Show the drop zone working, so a paste never looks like it was ignored. */
  function working(on, n){
    const zone = $("#fillzone");
    if(!zone) return;
    zone.classList.toggle("busy", on);
    if(on) zone.innerHTML = `<span class="spin" style="width:26px;height:26px"></span>
      <div>Adding ${n>1?n+" pictures":"the picture"}…</div>`;
  }

  /** Apply one or more images from here onwards, then move on. */
  async function take(root, got){
    if(!got || !got.length){ toast("No picture in what you dropped","err"); return; }
    let n = 0, linked = 0;
    for(const g of got){
      if(!cur) break;
      await applyImage(cur, g, null);
      n++; if(g.linked) linked++;
      advance();
    }
    took(root, n > 1 ? `${n} pictures added` : (linked ? "Picture linked from the web" : "Picture added"), false);
  }
  function took(root, msg, step=true){
    if(step) advance();
    toast(msg, "ok");
    renderPanel(); refreshWheel();
    draw(root);
  }

  async function onPaste(ev){
    if(busy) return;
    const dt = ev.clipboardData;
    const count = (dt?.files||[]).length;
    if(!count && !/image|text\/uri-list|text\/html/.test([...(dt?.types||[])].join(" "))) return;
    ev.preventDefault(); ev.stopPropagation();
    busy = true;
    working(true, count || 1);
    try{
      const got = await imagesFromTransfer(dt);
      if(!got.length){ toast("Nothing pasteable on the clipboard","err"); draw(modal.root); return; }
      await take(modal.root, got);
    }finally{ busy = false; }
  }
}

/* -------------------------------------------------------------- bulk paste */
function openBulk(wid){
  openModal({
    icon:"upload", cls:"wide", title:"Paste a list",
    sub:"One entry per line — paste as many as you like.",
    okLabel:"Add entries",
    body:`<div class="field">
        <textarea class="inp" id="bt" style="min-height:200px;font-family:var(--mono);font-size:13px" placeholder="Ada Lovelace&#10;Grace Hopper&#10;Katherine Johnson"></textarea>
      </div>
      <label class="checkrow"><input type="checkbox" id="bcomma"> Also split on commas</label>
      <label class="checkrow"><input type="checkbox" id="bclear"> Replace the current entries</label>
      <label class="checkrow"><input type="checkbox" id="bdedupe" checked> Skip names already on the wheel</label>`,
    onOpen(root){ setTimeout(()=>$("#bt",root).focus(),30); },
    onOk(root){
      const raw = $("#bt",root).value;
      const sep = $("#bcomma",root).checked ? /[\r\n,]+/ : /\r?\n/;
      let names = raw.split(sep).map(s=>s.trim()).filter(Boolean);
      if(!names.length){ toast("Nothing to add","err"); return false; }
      if($("#bclear",root).checked) DB.slicesOf(wid).forEach(s=>DB.remove(s.id));
      if($("#bdedupe",root).checked){
        const have = new Set(DB.slicesOf(wid).map(s=>(s.data.name||"").toLowerCase()));
        const before = names.length;
        names = names.filter(n=>{ const k = n.toLowerCase(); if(have.has(k)) return false; have.add(k); return true; });
        if(before !== names.length) toast(`Skipped ${before-names.length} duplicate${before-names.length>1?"s":""}`);
      }
      names.forEach(n=>createSlice(wid, n));
      renderPanel(); refreshWheel();
      toast(`Added ${plural(names.length,"entry","entries")}`,"ok");
      return true;
    }
  });
}

/* ============================================================================
   BACKUP I/O
   ============================================================================ */
function download(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportBackup(){
  download({ app:"wheel-of-everything", v:1, exported:now(), nodes:DB.all() },
           `wheel-of-everything-${new Date().toISOString().slice(0,10)}.json`);
  toast("Backup downloaded","ok");
}
function exportWheel(wid){
  const w = DB.get(wid); if(!w) return;
  download({ app:"wheel-of-everything", v:1, exported:now(), nodes:[w, ...DB.slicesOf(wid)] },
           `${(w.data.name||"wheel").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase()}.json`);
  toast("Wheel exported","ok");
}
function importBackup(){
  const input = $("#jsonpick");
  input.value = "";
  input.onchange = ()=>{
    const f = (input.files||[])[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      let doc;
      try{ doc = JSON.parse(fr.result); }catch{ toast("That isn't a readable backup","err"); return; }
      const nodes = Array.isArray(doc) ? doc : doc.nodes;
      if(!Array.isArray(nodes)){ toast("No wheels found in that file","err"); return; }
      // Fresh ids so an import never collides with what's already here.
      const map = new Map();
      nodes.filter(n=>n.type==="wheel").forEach(n=>map.set(n.id, uid("w")));
      let wheels = 0, slices = 0;
      nodes.forEach(n=>{
        if(n.deleted) return;
        if(n.type==="wheel"){
          DB.put({ ...n, id:map.get(n.id), updatedAt:now() }); wheels++;
        }else if(n.type==="slice" && map.has(n.wheelId)){
          DB.put({ ...n, id:uid("s"), wheelId:map.get(n.wheelId), updatedAt:now() }); slices++;
        }
      });
      render();
      toast(`Imported ${plural(wheels,"wheel")} and ${plural(slices,"entry","entries")}`,"ok");
    };
    fr.readAsText(f);
  };
  input.click();
}

    body:`<div class="field">
        <label>The basics</label>

          <li>For a single entry, the swatch beside its name opens the same options: a web search, a keyless search across <b>Wikimedia</b> and <b>Openverse</b>, a file from this computer, or a paste. You can also <b>drag</b> a picture from another tab straight onto a row — and dropping several at once fills that row and the ones below it.</li>

        <label>Keyboard</label>
        <ol class="steps" style="list-style:none;padding-left:0">
          <li><code>Space</code> spin the wheel &nbsp; <code>N</code> new entry / new wheel</li>
          <li><code>F</code> presentation mode &nbsp; <code>/</code> filter entries</li>
          <li><code>E</code> show or hide the side panel &nbsp; <code>Esc</code> back / close</li>
        </ol>
      </div>`,
  });
}

/* ============================================================================
   SYNC / SHARING SETUP
   ============================================================================ */
const SETUP_SQL = `-- Run once in Supabase → SQL Editor → New query → Run
create table if not exists wheel_nodes (
  id          text primary key,
  type        text not null,
  wheel_id    text,
  data        jsonb not null default '{}'::jsonb,
  deleted     boolean not null default false,
  updated_at  timestamptz not null default now(),
  client_id   text
);
alter table wheel_nodes enable row level security;
drop policy if exists wheel_open on wheel_nodes;
create policy wheel_open on wheel_nodes
  for all using (true) with check (true);
alter publication supabase_realtime add table wheel_nodes;

-- picture storage (optional but recommended)
insert into storage.buckets (id, name, public)
values ('wheel-images','wheel-images', true)
on conflict (id) do nothing;
drop policy if exists wheel_img_read on storage.objects;
create policy wheel_img_read on storage.objects
  for select using (bucket_id = 'wheel-images');
drop policy if exists wheel_img_write on storage.objects;
create policy wheel_img_write on storage.objects
  for insert with check (bucket_id = 'wheel-images');`;

function openSyncModal(){
  const cfg = Cloud.cfg || {};
  const connected = !!cfg.url;
  openModal({
    cls:"wide", icon:"cloud",
    title: connected ? "Sharing & sync" : "Set up sharing",
    sub: connected ? syncLabel() + (Cloud.statusMsg?` — ${h(Cloud.statusMsg)}`:"") : "Right now your wheels are saved on this device only.",
    body:`<div class="field">
        <label>How it works</label>
        <div class="hint" style="margin-top:0">
          Wheels sync through a free <b>Supabase</b> project — a hosted database with live updates.
          Anyone you give the two values below edits the same wheels, live, on any device.
          Pictures get uploaded there too instead of being stored inside this file's data.
          Without it everything still works; it just stays on this computer.
        </div>
      </div>
      <div class="field">
        <label>1 · Create the project</label>
        <ol class="steps">
          <li>Go to <code>supabase.com</code> → sign in → <b>New project</b> (the free tier is plenty).</li>
          <li>Open <b>SQL Editor</b> → <b>New query</b>, paste the script below, press <b>Run</b>.</li>
          <li>Open <b>Project Settings → API</b> and copy the <b>Project URL</b> and the <b>anon public</b> key.</li>
        </ol>
        <pre class="code" id="sql">${h(SETUP_SQL)}</pre>
        <button class="btn sm" id="copysql" style="margin-top:9px">${svg("copy")} Copy SQL</button>
      </div>
      <div class="field">
        <label>2 · Project URL</label>
        <input class="inp" id="curl" placeholder="https://xxxxxxxx.supabase.co" value="${h(cfg.url||"")}" spellcheck="false">
        <div class="hint">If it ends in <code>/rest/v1</code> that's fine — it gets trimmed automatically.</div>
      </div>
      <div class="field">
        <label>3 · Anon public key</label>
        <textarea class="inp" id="ckey" placeholder="eyJhbGciOi…" spellcheck="false" style="min-height:70px;font-family:var(--mono);font-size:12px">${h(cfg.key||"")}</textarea>
        <div class="hint">The anon key is meant to be public, but anyone holding these two values can edit or erase your wheels — share them only with people you trust.</div>
      </div>`,
    extra: connected?`<button class="btn danger sm" id="disc">Disconnect</button>`:"",
    okLabel: connected?"Save":"Connect",
    onOpen(root){
      $("#copysql",root).addEventListener("click", async()=>{
        try{ await navigator.clipboard.writeText(SETUP_SQL); toast("SQL copied","ok"); }
        catch{ const r=document.createRange(); r.selectNode($("#sql",root)); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Press ⌘C to copy"); }
      });
      $("#disc",root)?.addEventListener("click", ()=>{
        Cloud.disconnect(); closeModal(); toast("Disconnected — this device is local only");
      });
    },
    onOk(root){
      const url = sanitizeSupabaseUrl($("#curl",root).value);
      const key = $("#ckey",root).value.trim();
      if(!url || !key){
        if(!url && !key){ Cloud.disconnect(); return true; }
        toast("Both the URL and the key are needed","err"); return false;
      }
      if(!/^https:\/\/.+/.test(url)){ toast("The URL should start with https://","err"); return false; }
      Cloud.save({url,key});
      toast("Connecting…");
      setTimeout(async()=>{
        if(Cloud.status==="on"){
          try{ await Cloud.pushAll(); toast("Connected — wheels uploaded","ok"); }
          catch(err){ toast("Connected, but upload failed: "+(err.message||""),"err"); }
        }
      },1800);
      return true;
    }
  });
}

/* ============================================================================
   GLOBAL KEYS
   ============================================================================ */
document.addEventListener("keydown", ev=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")
              || document.activeElement?.isContentEditable;
  if(modalStack.length || $("#resultov")) return;   // those handle their own keys

  if(ev.key === "Escape"){
    if(UI.present){ togglePresent(); return; }
    if(UI.panelOpen){ UI.panelOpen=false; $(".panel")?.classList.remove("open"); return; }
    if(typing){ document.activeElement.blur(); return; }
    if(Route.name==="wheel") go("#/");
    return;
  }
  if(typing) return;

  if(ev.key === " " && Route.name==="wheel"){
    ev.preventDefault();
    if(!Spin.running) Spin.start(Route.wid, $("#wheel"));
  }
  else if(ev.key.toLowerCase() === "n"){
    ev.preventDefault();
    if(Route.name==="wheel"){ UI.tab="entries"; renderPanel(); $("#qadd")?.focus(); }
    else promptWheel(null);
  }
  else if(ev.key.toLowerCase() === "f" && Route.name==="wheel"){ ev.preventDefault(); togglePresent(); }
  else if(ev.key.toLowerCase() === "e" && Route.name==="wheel"){
    ev.preventDefault();
    UI.panelHidden = !UI.panelHidden; render();
  }
  else if(ev.key === "/" && Route.name==="wheel"){
    ev.preventDefault();
    UI.tab = "entries"; renderPanel();
    ($("#qfilter") || $("#qadd"))?.focus();
  }
});

   BOOT
   ============================================================================ */
function seedFirstRun(){
  if(Prefs.get().seeded || DB.wheelList().length) return;
  Prefs.set("seeded", true);
  const id = createWheel("What's for dinner?",
    ["Pizza","Thai","Ramen","Tacos","Curry","Roast","Pasta","Whatever's in the fridge"]);
  patch(id, d=>{
    d.desc = "A starter wheel — rename it, empty it, or spin it as it is.";
    d.opts = { ...DEFAULT_OPTS, palette:"sunset" };
  });
}

loadLocal();
seedFirstRun();
Object.assign(Route, parseHash());
Cloud.init();
render();

/* Drive the winner's slow pulse without re-running the whole render loop. It
   settles into a static highlight after WINNER_PULSE_MS, and the timer then
   costs nothing but the condition check. */
setInterval(()=>{
  if(Spin.running || Route.name!=="wheel" || $("#resultov")) return;
  if(winnerPulsing()) refreshWheel();
}, 90);
</script>
